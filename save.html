<html lang="en">

<head>

            font-family: 'Inter', sans-serif;

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="feed.html"><img src="src/assets/logo.svg" class="h-10 w-auto" alt="logo" /></a>
            <div class="hidden sm:flex items-center gap-4">
                <a href="notifications.html"
                    class="text-slate-500 hover:text-brand-blue font-bold text-sm">Notifications</a>
                <a href="feed.html" class="text-slate-500 hover:text-brand-blue font-bold text-sm">Back to Feed</a>
                <a href="profile.html">
                    <img id="nav-profile-img" src="src/assets/avatar-placeholder.png"
                        class="w-8 h-8 rounded-full border border-slate-200" />
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Saved Posts</h1>
            <p class="text-slate-500 mt-1">Your collection of posts to cry about later.</p>
        </div>

        <div id="saved-posts-container" class="space-y-6">
            <div id="loading-spinner" class="flex justify-center items-center py-20">
                <i data-lucide="loader-2" class="w-12 h-12 text-slate-400 animate-spin"></i>
            </div>
        </div>
    </main>

    </main>

    <!-- Mobile Bottom Nav -->
    <div class="mobile-bottom-nav shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <a href="feed.html" class="mobile-nav-item">
            <i data-lucide="home"></i>
            <span>Home</span>
        </a>
        <a href="groups.html" class="mobile-nav-item">
            <i data-lucide="users-2"></i>
            <span>Groups</span>
        </a>
        <a href="save.html" class="mobile-nav-item active text-brand-blue">
            <i data-lucide="bookmark"></i>
            <span>Saved</span>
        </a>
        <a href="messages.html" class="mobile-nav-item relative">
            <i data-lucide="message-square"></i>
            <span>Msgs</span>
            <span id="mobile-msg-badge" class="hidden absolute top-0 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <img id="mobile-nav-profile-img" src="src/assets/avatar-placeholder.png"
                class="w-6 h-6 rounded-full border border-slate-200">
            <span>Profile</span>
        </a>
    </div>

    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onIdTokenChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { createPostElement, showToast } from './shared/ui.js';

        let currentUser = null;

        // --- FETCH SAVED POSTS ---
        async function fetchSavedPosts() {
            if (!currentUser) return;

            const container = document.getElementById('saved-posts-container');
            const spinner = document.getElementById('loading-spinner');

            try {
                // 1. Get the IDs of all posts saved by the current user
                const { data: savedRelations, error: savedError } = await supabase
                    .from('saved_posts')
                    .select('post_id')
                    .eq('user_id', currentUser.uid);

                if (savedError) throw savedError;

                if (!savedRelations || savedRelations.length === 0) {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        You haven't saved any posts yet.
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                const postIds = savedRelations.map(r => r.post_id);

                // 2. Fetch the full post data for those IDs
                const { data: posts, error: postsError } = await supabase
                    .from('posts')
                    .select(`*, likes(count), comments(count), profiles(username, full_name, avatar_url)`)
                    .in('id', postIds)
                    .order('created_at', { ascending: false });

                if (postsError) throw postsError;

                // 3. Fetch the current user's like states for these posts
                let likeStates = {};
                if (posts && posts.length > 0) {
                    const { data: likedData, error: likesError } = await supabase
                        .from('likes')
                        .select('post_id')
                        .eq('user_id', currentUser.uid)
                        .in('post_id', postIds);
                    
                    if (likesError) {
                        console.warn('save page likes query failed:', likesError.message);
                    }
                    if (likedData) {
                        likeStates = likedData.reduce((acc, l) => ({ ...acc, [String(l.post_id)]: true }), {});
                    }
                }

                container.innerHTML = ''; // Clear spinner

                if (posts && posts.length > 0) {
                    posts.forEach(post => {
                        // Enrich post with like/save state so icons render correctly
                        const enriched = {
                            ...post,
                            is_liked_by_user: !!likeStates[String(post.id)],
                            is_saved_by_user: true // All posts here are saved by definition
                        };
                        const el = createPostElement(enriched, currentUser);
                        container.appendChild(el);
                    });
                } else {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        Could not find the posts you saved. They may have been deleted.
                    </div>`;
                }

                lucide.createIcons();

            } catch (err) {
                console.error("Error fetching saved posts:", err);
                if (spinner) spinner.classList.add('hidden');
                container.innerHTML = `
                <div class="p-4 text-red-700 bg-red-100 rounded-lg">
                    <strong>Error:</strong> ${err.message}
                </div>`;
            }
        }

        // --- INIT ---
        onIdTokenChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // FIX: Use manual token setter to bypass Supabase Auth RS256 validation error
                await setSupabaseToken(await user.getIdToken());

                // Update nav bar avatar
                const photo = user.photoURL || 'src/assets/avatar-placeholder.png';
                const navImg = document.getElementById('nav-profile-img');
                if (navImg) navImg.src = photo;
                // Also update the bottom nav profile image
                const mobileNavImg = document.getElementById('mobile-nav-profile-img');
                if (mobileNavImg) mobileNavImg.src = photo;

                // Fetch the saved posts for this user
                fetchSavedPosts();
            } else {
                // Not logged in, redirect to login page
                window.location.href = 'Auth/login.html';
            }
        });

        // --- NOTIFICATION HELPER ---
        async function createNotification(type, entityId, recipientId) {
            if (!currentUser || currentUser.uid === recipientId) return;

            const payload = {
                type,
                user_id: recipientId,
                actor_id: currentUser.uid
            };

            if (type === 'like' || type === 'comment') {
                payload.post_id = entityId;
            }

            try {
                await supabase.from('notifications').insert(payload);
            } catch (error) {
                console.error("Notification failed:", error);
            }
        }

        // --- POST ACTIONS ---
        async function handlePostAction(e) {
            const btn = e.target.closest('button');
            if (!btn || !currentUser) return;

            const postId = btn.dataset.postId;

            // LIKE
            if (btn.classList.contains('like-btn')) {
                const countSpan = btn.querySelector('span');
                const icon = btn.querySelector('svg');
                const isLiked = btn.classList.contains('text-red-500');

                if (isLiked) {
                    btn.classList.remove('text-red-500');
                    if (icon) icon.classList.remove('fill-current');
                    countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                    await supabase.from('likes').delete().eq('user_id', currentUser.uid).eq('post_id', postId);
                } else {
                    btn.classList.add('text-red-500');
                    if (icon) icon.classList.add('fill-current');
                    countSpan.textContent = parseInt(countSpan.textContent) + 1;
                    await supabase.from('likes').insert({ user_id: currentUser.uid, post_id: postId });

                    const postCard = btn.closest('.post-card');
                    if (postCard && postCard.dataset.authorId) {
                        createNotification('like', postId, postCard.dataset.authorId);
                    }
                }
            }

            // COMMENTS TOGGLE
            if (btn.classList.contains('comment-btn')) {
                const card = btn.closest('.post-card');
                const section = card.querySelector('.comment-section');
                section.classList.toggle('hidden');
                if (!section.classList.contains('hidden')) {
                    loadComments(postId, section.querySelector('.comments-list'));
                }
            }

            // DELETE
            if (btn.classList.contains('delete-btn')) {
                if (confirm("Delete this post?")) {
                    const { error } = await supabase.from('posts').delete().eq('id', postId);
                    if (!error) btn.closest('.post-card').remove();
                }
            }

            // SAVE / UNSAVE
            if (btn.classList.contains('save-btn')) {
                const icon = btn.querySelector('svg');
                const span = btn.querySelector('span');
                const isSaved = btn.classList.contains('text-green-500');

                if (isSaved) {
                    btn.classList.remove('text-green-500');
                    if (icon) icon.classList.remove('fill-current');
                    if (span) span.textContent = 'Save';
                    await supabase.from('saved_posts').delete().eq('user_id', currentUser.uid).eq('post_id', postId);
                    
                    // On Saved page, remove post immediately
                    const card = btn.closest('.post-card');
                    if (card) {
                        card.remove();
                        const savedContainer = document.getElementById('saved-posts-container');
                        if (savedContainer && savedContainer.children.length === 0) {
                            savedContainer.innerHTML = `
                            <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center max-w-lg mx-auto">
                                <p class="text-slate-500">You haven't saved any posts yet.</p>
                                <a href="feed.html" class="text-brand-blue font-bold mt-2 inline-block hover:underline">Explore the Feed</a>
                            </div>`;
                        }
                    }
                } else {
                    btn.classList.add('text-green-500');
                    if (icon) icon.classList.add('fill-current');
                    if (span) span.textContent = 'Saved';
                    await supabase.from('saved_posts').insert({ user_id: currentUser.uid, post_id: postId });
                }
            }

            // DELETE COMMENT
            if (btn.classList.contains('delete-comment-btn')) {
                const commentId = btn.dataset.commentId;
                if (confirm("Delete this comment?")) {
                    const { error } = await supabase.from('comments').delete().eq('id', commentId);
                    if (!error) {
                        const commentDiv = btn.closest('.comment-item');
                        if (commentDiv) commentDiv.remove();

                        const postCard = btn.closest('.post-card');
                        const countSpan = postCard.querySelector('.comment-btn span');
                        if (countSpan) countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                    } else {
                        showToast("Error deleting comment: " + error.message, 'error');
                    }
                }
            }
        }

        // --- EVENTS ---
        const container = document.getElementById('saved-posts-container');
        if (container) {
            container.addEventListener('click', handlePostAction);
            container.addEventListener('submit', async (e) => {
                if (e.target.classList.contains('comment-form')) {
                    e.preventDefault();
                    const form = e.target;
                    const input = form.querySelector('input');
                    const content = input.value.trim();
                    const postId = form.dataset.postId;

                    if (!content || !currentUser) return;
                    input.value = '';

                    const { error } = await supabase.from('comments').insert({
                        post_id: postId, user_id: currentUser.uid, content
                    });

                    if (!error) {
                        loadComments(postId, form.previousElementSibling);
                        const btnSpan = form.closest('.post-card').querySelector('.comment-btn span');
                        if (btnSpan) btnSpan.textContent = parseInt(btnSpan.textContent) + 1;

                        const postCard = form.closest('.post-card');
                        if (postCard && postCard.dataset.authorId) {
                            createNotification('comment', postId, postCard.dataset.authorId);
                        }
                    }
                }
            });
        }

        async function loadComments(postId, container) {
            container.innerHTML = '<div class="text-xs text-slate-400 p-2">Loading...</div>';
            const { data: comments } = await supabase.from('comments')
                .select('id, user_id, content, created_at, profiles(username, avatar_url)')
                .eq('post_id', postId).order('created_at', { ascending: true });

            container.innerHTML = '';
            if (!comments || !comments.length) {
                container.innerHTML = '<div class="text-xs text-slate-400 p-2">No comments yet.</div>';
                return;
            }

            comments.forEach(c => {
                const isOwner = currentUser && c.user_id === currentUser.uid;
                const deleteBtn = isOwner ? `
                    <button class="delete-comment-btn text-slate-400 hover:text-red-500 transition p-1" title="Delete Comment" data-comment-id="${c.id}">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>` : '';

                const div = document.createElement('div');
                div.className = "comment-item flex gap-2 mb-2 text-sm group";
                div.innerHTML = `
                <img src="${c.profiles?.avatar_url || 'src/assets/avatar-placeholder.png'}" class="w-6 h-6 rounded-full mt-1 object-cover">
                <div class="flex-1">
                    <div class="bg-slate-50 p-2 rounded-lg relative">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-slate-900 text-xs">${c.profiles?.username || 'User'}</span>
                            ${deleteBtn}
                        </div>
                        <p class="text-slate-700 mt-1">${c.content}</p>
                    </div>
                </div>`;
                container.appendChild(div);
            });
            lucide.createIcons({ nodes: [container] });
        }

        lucide.createIcons();
    </script>
</body>

</html>
