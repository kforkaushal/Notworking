<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Posts - NotWorking</title>
    <meta name="description" content="Your collection of posts to cry about later. Saved content on NotWorking.">
    <meta name="robots" content="noindex, nofollow"> <!-- Details pages like saved usually noindex -->
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/save.html">
    <meta property="og:title" content="Saved Posts - NotWorking">
    <meta property="og:description" content="Your collection of posts to cry about later.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/save.html">
    <meta property="twitter:title" content="Saved Posts - NotWorking">
    <meta property="twitter:description" content="Your collection of posts to cry about later.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/save.html" />

    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="feed.html"><img src="src/assets/logo.svg" class="h-10 w-auto" alt="logo" /></a>
            <div class="hidden md:flex items-center gap-4">
                <a href="notifications.html"
                    class="text-slate-500 hover:text-brand-blue font-bold text-sm">Notifications</a>
                <a href="feed.html" class="text-slate-500 hover:text-brand-blue font-bold text-sm">Back to Feed</a>
                <a href="profile.html">
                    <img id="nav-profile-img" src="src/assets/avatar-placeholder.png"
                        class="w-8 h-8 rounded-full border border-slate-200" />
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 pt-8 pb-28">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Saved Posts</h1>
            <p class="text-slate-500 mt-1">Your collection of posts to cry about later.</p>
        </div>

        <div id="saved-posts-container" class="space-y-6">
            <div id="loading-spinner" class="flex justify-center items-center py-20">
                <i data-lucide="loader-2" class="w-12 h-12 text-slate-400 animate-spin"></i>
            </div>
        </div>
    </main>

    </main>

    <!-- Mobile Bottom Nav Container -->
    <div id="mobile-nav-container"></div>

    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onIdTokenChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { createPostElement, showToast, showAuthGateModal, closeAllPostMenus, injectMobileBottomNav } from './shared/ui.js';

        // Initialize mobile bottom nav
        injectMobileBottomNav('saved');

        let currentUser = null;
        // Prevents double-click race conditions on like/unlike (flowchart fix #4)
        const inFlightLikes = new Set();

        // --- FETCH SAVED POSTS ---
        async function fetchSavedPosts() {
            if (!currentUser) return;

            const container = document.getElementById('saved-posts-container');
            const spinner = document.getElementById('loading-spinner');

            try {
                // 1. Get the IDs of all posts saved by the current user
                const { data: savedRelations, error: savedError } = await supabase
                    .from('saved_posts')
                    .select('post_id')
                    .eq('user_id', currentUser.uid);

                if (savedError) throw savedError;

                if (!savedRelations || savedRelations.length === 0) {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        You haven't saved any posts yet.
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                const postIds = savedRelations.map(r => r.post_id);

                // 2. Fetch the full post data for those IDs
                const { data: posts, error: postsError } = await supabase
                    .from('posts')
                    .select(`*, likes(count), comments(count), profiles(username, full_name, avatar_url)`)
                    .in('id', postIds)
                    .order('created_at', { ascending: false });

                if (postsError) throw postsError;

                // 3. Fetch the current user's like states and follow states for these posts
                let likeStates = {};
                let followStates = {};
                if (posts && posts.length > 0) {
                    const authorIds = [...new Set(posts.map(p => p.user_id))];
                    const [likedRes, followRes] = await Promise.all([
                        supabase.from('likes').select('post_id').eq('user_id', currentUser.uid).in('post_id', postIds),
                        supabase.from('followers').select('following_id').eq('follower_id', currentUser.uid).in('following_id', authorIds)
                    ]);
                    
                    if (likedRes.error) console.warn('save page likes query failed:', likedRes.error.message);
                    if (followRes.error) console.warn('save page follow query failed:', followRes.error.message);
                    
                    if (likedRes.data) {
                        likeStates = likedRes.data.reduce((acc, l) => ({ ...acc, [String(l.post_id)]: true }), {});
                    }
                    if (followRes.data) {
                        followStates = followRes.data.reduce((acc, f) => ({ ...acc, [String(f.following_id)]: true }), {});
                    }
                }

                container.innerHTML = ''; // Clear spinner

                if (posts && posts.length > 0) {
                    posts.forEach(post => {
                        // Enrich post with like/save state so icons render correctly
                        const enriched = {
                            ...post,
                            is_liked_by_user: !!likeStates[String(post.id)],
                            is_saved_by_user: true, // All posts here are saved by definition
                            is_following_author: !!followStates[String(post.user_id)]
                        };
                        const el = createPostElement(enriched, currentUser);
                        container.appendChild(el);
                    });
                } else {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        Could not find the posts you saved. They may have been deleted.
                    </div>`;
                }

                lucide.createIcons();

            } catch (err) {
                console.error("Error fetching saved posts:", err);
                if (spinner) spinner.classList.add('hidden');
                container.innerHTML = `
                <div class="p-4 text-red-700 bg-red-100 rounded-lg">
                    <strong>Error:</strong> ${err.message}
                </div>`;
            }
        }

        // --- INIT ---
        onIdTokenChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // FIX: Use manual token setter to bypass Supabase Auth RS256 validation error
                await setSupabaseToken(await user.getIdToken());

                // Verify profile completeness
                let profile = null;
                try {
                    const { data } = await supabase.from('profiles')
                        .select('username, full_name, avatar_url, bio, experience, skills')
                        .eq('id', user.uid)
                        .maybeSingle();
                    profile = data;
                } catch (e) {
                    console.error("Error checking profile in save.html:", e);
                }

                if (!profile || !profile.username) {
                    console.log("Profile incomplete or missing. Redirecting to setup.html...");
                    window.location.href = 'Auth/setup.html';
                    return;
                }

                // Update nav bar avatar
                const photo = profile.avatar_url || 'src/assets/avatar-placeholder.png';
                const navImg = document.getElementById('nav-profile-img');
                if (navImg) navImg.src = photo;
                // Also update the bottom nav profile image
                const mobileNavImg = document.getElementById('mobile-nav-profile-img');
                if (mobileNavImg) mobileNavImg.src = photo;

                // Fetch the saved posts for this user
                fetchSavedPosts();
            } else {
                // Not logged in, redirect to login page
                window.location.href = 'Auth/login.html';
            }
        });

        // --- NOTIFICATION HELPER ---
        async function createNotification(type, entityId, recipientId) {
            if (!currentUser || currentUser.uid === recipientId) return;

            const payload = {
                type,
                user_id: recipientId,
                actor_id: currentUser.uid
            };

            if (type === 'like' || type === 'comment') {
                payload.post_id = entityId;
            }

            try {
                await supabase.from('notifications').insert(payload);
            } catch (error) {
                console.error("Notification failed:", error);
            }
        }

        // --- POST ACTIONS ---
        async function handlePostAction(e) {
            const btn = e.target.closest('button');
            if (!btn) return;

            // Auth Gate Interceptor
            if (btn.dataset.requiresAuth === 'true' && !currentUser) {
                e.stopPropagation();
                showAuthGateModal();
                return;
            }

            const postId = btn.dataset.postId;

            // 1. THREE-DOT MENU TOGGLE
            if (btn.classList.contains('three-dot-btn')) {
                e.stopPropagation();
                const card = btn.closest('.post-card');
                const menu = card.querySelector('.post-dropdown-menu');
                const isVisible = menu.style.display === 'block';
                closeAllPostMenus();
                if (!isVisible) {
                    menu.style.display = 'block';
                }
                return;
            }

            // 2. SHARE MENU TOGGLE
            if (btn.classList.contains('share-btn')) {
                e.stopPropagation();
                const card = btn.closest('.post-card');
                const menu = card.querySelector('.share-submenu');
                const isVisible = menu.style.display === 'block';
                closeAllPostMenus();
                if (!isVisible) {
                    menu.style.display = 'block';
                }
                return;
            }

            // 3. COPY LINK / INSTAGRAM COPY
            if (btn.classList.contains('copy-link-btn') || btn.classList.contains('copy-link-share-btn') || btn.classList.contains('share-instagram-btn')) {
                const url = btn.dataset.postUrl;
                try {
                    await navigator.clipboard.writeText(url);
                    if (btn.classList.contains('share-instagram-btn')) {
                        showToast("Link copied! Paste it in your Instagram story or message.", "success");
                    } else {
                        showToast("Link copied to clipboard!", "success");
                    }
                } catch (err) {
                    console.error("Clipboard copy error:", err);
                    showToast("Failed to copy link.", "error");
                }
                closeAllPostMenus();
                return;
            }

            // 4. NATIVE SHARE
            if (btn.classList.contains('native-share-btn')) {
                const url = btn.dataset.postUrl;
                const title = btn.dataset.postTitle;
                if (navigator.share) {
                    navigator.share({ title, url }).catch(err => console.warn("Native share cancelled:", err));
                }
                closeAllPostMenus();
                return;
            }

            // 5. ABOUT POST TOGGLE
            if (btn.classList.contains('about-post-btn')) {
                e.stopPropagation();
                const card = btn.closest('.post-card');
                const panel = card.querySelector('.about-post-panel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                return;
            }

            // 6. FOLLOW/UNFOLLOW FROM MENU
            if (btn.classList.contains('follow-from-menu-btn')) {
                closeAllPostMenus();
                const authorId = btn.dataset.authorId;
                const authorUsername = btn.dataset.authorUsername;
                const labelSpan = btn.querySelector('.follow-menu-label');
                const isFollowing = labelSpan.textContent.includes('Unfollow');

                if (isFollowing) {
                    labelSpan.textContent = `Follow @${authorUsername}`;
                    try {
                        const { error } = await supabase.from('followers').delete().eq('follower_id', currentUser.uid).eq('following_id', authorId);
                        if (error) throw error;
                        showToast(`Unfollowed @${authorUsername}`, "info");
                    } catch (err) {
                        labelSpan.textContent = `Unfollow @${authorUsername}`;
                        showToast("Failed to unfollow. Please try again.", "error");
                        console.error(err);
                    }
                } else {
                    labelSpan.textContent = `Unfollow @${authorUsername}`;
                    try {
                        const { error } = await supabase.from('followers').insert({ follower_id: currentUser.uid, following_id: authorId });
                        if (error) throw error;
                        createNotification('follow', null, authorId);
                        showToast(`Following @${authorUsername}`, "success");
                    } catch (err) {
                        labelSpan.textContent = `Follow @${authorUsername}`;
                        showToast("Failed to follow. Please try again.", "error");
                        console.error(err);
                    }
                }
                return;
            }

            // 7. SAVE/UNSAVE FROM MENU
            if (btn.classList.contains('save-from-menu-btn')) {
                closeAllPostMenus();
                const isSaved = btn.dataset.isSaved === '1';
                const labelSpan = btn.querySelector('.save-menu-label');
                const svg = btn.querySelector('svg');

                if (isSaved) {
                    btn.dataset.isSaved = '0';
                    labelSpan.textContent = 'Save post';
                    btn.classList.remove('text-green-600');
                    btn.classList.add('text-slate-700');
                    if (svg) {
                        svg.setAttribute('fill', 'none');
                        svg.classList.remove('text-green-500');
                        svg.classList.add('text-slate-500');
                    }
                    try {
                        const { error } = await supabase.from('saved_posts').delete().eq('user_id', currentUser.uid).eq('post_id', postId);
                        if (error) throw error;
                        
                        // Remove from saved page container immediately
                        const card = btn.closest('.post-card');
                        if (card) {
                            card.remove();
                            const savedContainer = document.getElementById('saved-posts-container');
                            if (savedContainer && savedContainer.querySelectorAll('.post-card').length === 0) {
                                savedContainer.innerHTML = `
                                <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg max-w-lg mx-auto">
                                    <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                                    You haven't saved any posts yet.
                                </div>`;
                                lucide.createIcons();
                            }
                        }
                    } catch (err) {
                        btn.dataset.isSaved = '1';
                        labelSpan.textContent = 'Unsave post';
                        btn.classList.add('text-green-600');
                        btn.classList.remove('text-slate-700');
                        if (svg) {
                            svg.setAttribute('fill', 'currentColor');
                            svg.classList.add('text-green-500');
                            svg.classList.remove('text-slate-500');
                        }
                        showToast("Failed to unsave post.", "error");
                    }
                } else {
                    btn.dataset.isSaved = '1';
                    labelSpan.textContent = 'Unsave post';
                    btn.classList.add('text-green-600');
                    btn.classList.remove('text-slate-700');
                    if (svg) {
                        svg.setAttribute('fill', 'currentColor');
                        svg.classList.add('text-green-500');
                        svg.classList.remove('text-slate-500');
                    }
                    try {
                        const { error } = await supabase.from('saved_posts').insert({ user_id: currentUser.uid, post_id: postId });
                        if (error) throw error;
                    } catch (err) {
                        btn.dataset.isSaved = '0';
                        labelSpan.textContent = 'Save post';
                        btn.classList.remove('text-green-600');
                        btn.classList.add('text-slate-700');
                        if (svg) {
                            svg.setAttribute('fill', 'none');
                            svg.classList.remove('text-green-500');
                            svg.classList.add('text-slate-500');
                        }
                        showToast("Failed to save post.", "error");
                    }
                }
                return;
            }

            // 8. DELETE FROM MENU
            if (btn.classList.contains('delete-from-menu-btn')) {
                closeAllPostMenus();
                if (confirm("Delete this post?")) {
                    const { error } = await supabase.from('posts').delete().eq('id', postId);
                    if (!error) {
                        btn.closest('.post-card').remove();
                        showToast("Post deleted successfully", "success");
                    } else {
                        showToast("Error deleting post: " + error.message, "error");
                    }
                }
                return;
            }

            // 9. LIKE
            if (btn.classList.contains('like-btn')) {
                if (inFlightLikes.has(postId)) return;
                inFlightLikes.add(postId);

                const countSpan = btn.querySelector('span');
                const icon = btn.querySelector('svg');
                const isLiked = btn.classList.contains('text-red-500');

                if (isLiked) {
                    btn.classList.remove('text-red-500', 'bg-red-50');
                    btn.classList.add('text-slate-500', 'hover:text-red-500', 'hover:bg-red-50');
                    if (icon) icon.setAttribute('fill', 'none');
                    countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                    try {
                        const { error } = await supabase.from('likes').delete().eq('user_id', currentUser.uid).eq('post_id', postId);
                        if (error) throw error;
                    } catch (err) {
                        btn.classList.add('text-red-500', 'bg-red-50');
                        btn.classList.remove('text-slate-500', 'hover:text-red-500', 'hover:bg-red-50');
                        if (icon) icon.setAttribute('fill', 'currentColor');
                        countSpan.textContent = parseInt(countSpan.textContent) + 1;
                        showToast("Failed to unlike post.", "error");
                        console.error("Unlike DB error in save.html:", err);
                    }
                } else {
                    btn.classList.add('text-red-500', 'bg-red-50');
                    btn.classList.remove('text-slate-500', 'hover:text-red-500', 'hover:bg-red-50');
                    if (icon) icon.setAttribute('fill', 'currentColor');
                    countSpan.textContent = parseInt(countSpan.textContent) + 1;
                    try {
                        const { error } = await supabase.from('likes').insert({ user_id: currentUser.uid, post_id: postId });
                        if (error) throw error;
                        const postCard = btn.closest('.post-card');
                        if (postCard && postCard.dataset.authorId && postCard.dataset.authorId !== currentUser.uid) {
                            createNotification('like', postId, postCard.dataset.authorId);
                        }
                    } catch (err) {
                        btn.classList.remove('text-red-500', 'bg-red-50');
                        btn.classList.add('text-slate-500', 'hover:text-red-500', 'hover:bg-red-50');
                        if (icon) icon.setAttribute('fill', 'none');
                        countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                        showToast("Failed to like post.", "error");
                        console.error("Like DB error in save.html:", err);
                    }
                }
                inFlightLikes.delete(postId);
            }

            // 10. COMMENT TOGGLE
            if (btn.classList.contains('comment-btn')) {
                const card = btn.closest('.post-card');
                const section = card.querySelector('.comment-section');
                const isHidden = section.style.display === 'none';
                section.style.display = isHidden ? 'block' : 'none';
                if (isHidden) {
                    loadComments(postId, section.querySelector('.comments-list'));
                }
            }

            // 11. DELETE COMMENT
            if (btn.classList.contains('delete-comment-btn')) {
                const commentId = btn.dataset.commentId;
                if (confirm("Delete this comment?")) {
                    const { error } = await supabase.from('comments').delete().eq('id', commentId);
                    if (!error) {
                        const commentDiv = btn.closest('.comment-item');
                        if (commentDiv) commentDiv.remove();

                        const postCard = btn.closest('.post-card');
                        const countSpan = postCard.querySelector('.comment-btn span');
                        if (countSpan) countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                    } else {
                        showToast("Error deleting comment: " + error.message, 'error');
                    }
                }
            }
        }

        // --- EVENTS ---
        const container = document.getElementById('saved-posts-container');
        if (container) {
            container.addEventListener('click', handlePostAction);
            container.addEventListener('submit', async (e) => {
                if (e.target.classList.contains('comment-form')) {
                    e.preventDefault();
                    const form = e.target;
                    const input = form.querySelector('input');
                    const content = input.value.trim();
                    const postId = form.dataset.postId;

                    if (!content || !currentUser) return;
                    input.value = '';

                    const { error } = await supabase.from('comments').insert({
                        post_id: postId, user_id: currentUser.uid, content
                    });

                    if (!error) {
                        loadComments(postId, form.previousElementSibling);
                        const btnSpan = form.closest('.post-card').querySelector('.comment-btn span');
                        if (btnSpan) btnSpan.textContent = parseInt(btnSpan.textContent) + 1;

                        const postCard = form.closest('.post-card');
                        if (postCard && postCard.dataset.authorId) {
                            createNotification('comment', postId, postCard.dataset.authorId);
                        }
                    }
                }
            });
        }

        async function loadComments(postId, container) {
            container.innerHTML = '<div class="text-xs text-slate-400 p-2">Loading...</div>';
            const { data: comments } = await supabase.from('comments')
                .select('id, user_id, content, created_at, profiles(username, avatar_url)')
                .eq('post_id', postId).order('created_at', { ascending: true });

            container.innerHTML = '';
            if (!comments || !comments.length) {
                container.innerHTML = '<div class="text-xs text-slate-400 p-2">No comments yet.</div>';
                return;
            }

            comments.forEach(c => {
                const isOwner = currentUser && c.user_id === currentUser.uid;
                const deleteBtn = isOwner ? `
                    <button class="delete-comment-btn text-slate-400 hover:text-red-500 transition p-1" title="Delete Comment" data-comment-id="${c.id}">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>` : '';

                const div = document.createElement('div');
                div.className = "comment-item flex gap-2 mb-2 text-sm group";
                div.innerHTML = `
                <img src="${c.profiles?.avatar_url || 'src/assets/avatar-placeholder.png'}" class="w-6 h-6 rounded-full mt-1 object-cover">
                <div class="flex-1">
                    <div class="bg-slate-50 p-2 rounded-lg relative">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-slate-900 text-xs">${c.profiles?.username || 'User'}</span>
                            ${deleteBtn}
                        </div>
                        <p class="text-slate-700 mt-1">${c.content}</p>
                    </div>
                </div>`;
                container.appendChild(div);
            });
            lucide.createIcons({ nodes: [container] });
        }

        // Close menus when clicking outside
        document.addEventListener('click', () => {
            closeAllPostMenus();
        });

        lucide.createIcons();
    </script>
</body>

</html>
