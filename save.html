<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Posts - NotWorking</title>
    <meta name="description" content="Your collection of posts to cry about later. Saved content on NotWorking.">
    <meta name="robots" content="noindex, nofollow"> <!-- Details pages like saved usually noindex -->
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/save.html">
    <meta property="og:title" content="Saved Posts - NotWorking">
    <meta property="og:description" content="Your collection of posts to cry about later.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/save.html">
    <meta property="twitter:title" content="Saved Posts - NotWorking">
    <meta property="twitter:description" content="Your collection of posts to cry about later.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/save.html" />

    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="feed.html"><img src="src/assets/logo.svg" class="h-10 w-auto" alt="logo" /></a>
            <div class="flex items-center gap-4 hidden sm:flex">
                <a href="notifications.html"
                    class="text-slate-500 hover:text-brand-blue font-bold text-sm">Notifications</a>
                <a href="feed.html" class="text-slate-500 hover:text-brand-blue font-bold text-sm">Back to Feed</a>
                <a href="profile.html">
                    <img id="nav-profile-img" src="src/assets/avatar-placeholder.png"
                        class="w-8 h-8 rounded-full border border-slate-200" />
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Saved Posts</h1>
            <p class="text-slate-500 mt-1">Your collection of posts to cry about later.</p>
        </div>

        <div id="saved-posts-container" class="space-y-6">
            <div id="loading-spinner" class="flex justify-center items-center py-20">
                <i data-lucide="loader-2" class="w-12 h-12 text-slate-400 animate-spin"></i>
            </div>
        </div>
    </main>

    </main>

    <!-- Mobile Bottom Nav -->
    <div class="mobile-bottom-nav shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <a href="feed.html" class="mobile-nav-item">
            <i data-lucide="home"></i>
            <span>Home</span>
        </a>
        <a href="groups.html" class="mobile-nav-item">
            <i data-lucide="users-2"></i>
            <span>Groups</span>
        </a>
        <a href="save.html" class="mobile-nav-item active text-brand-blue">
            <i data-lucide="bookmark"></i>
            <span>Saved</span>
        </a>
        <a href="messages.html" class="mobile-nav-item relative">
            <i data-lucide="message-square"></i>
            <span>Msgs</span>
            <span id="mobile-msg-badge" class="hidden absolute top-0 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <img id="mobile-nav-profile-img" src="src/assets/avatar-placeholder.png"
                class="w-6 h-6 rounded-full border border-slate-200">
            <span>Profile</span>
        </a>
    </div>

    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onIdTokenChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        let currentUser = null;

        // --- RENDER POST (Copied from feed.html, can be modularized later) ---
        function createPostElement(post) {
            const isOwner = currentUser && post.user_id === currentUser.uid;
            const likeCount = post.likes?.[0]?.count || 0;
            const commentCount = post.comments?.[0]?.count || 0;
            const avatar = post.profiles?.avatar_url || 'src/assets/avatar-placeholder.png';
            const name = post.profiles?.full_name || 'Anonymous';
            const username = post.profiles?.username || '';

            const div = document.createElement('div');
            div.className = "post-card bg-white p-5 rounded-2xl shadow border border-slate-200 mb-6 relative group";

            let mediaHTML = '';
            if (post.media_url) {
                mediaHTML = post.media_type === 'video'
                    ? `<video controls src="${post.media_url}" class="mt-4 rounded-lg w-full max-h-96 object-cover bg-black"></video>`
                    : `<img src="${post.media_url}" loading="lazy" class="mt-4 rounded-lg w-full max-h-96 object-cover bg-slate-100">`;
            }

            div.innerHTML = `
            <div class="flex items-start gap-4">
                <a href="profile.html?username=${username}" class="flex-shrink-0">
                    <img src="${avatar}" class="w-12 h-12 rounded-full object-cover border border-slate-200" />
                </a>
                <div class="w-full">
                    <div class="flex justify-between items-start">
                        <div>
                            <a href="profile.html?username=${username}" class="font-bold text-slate-900 hover:underline">${name}</a>
                            <p class="text-xs text-slate-500">${new Date(post.created_at).toLocaleString()}</p>
                        </div>
                    </div>
                    <p class="mt-3 text-slate-800 text-lg whitespace-pre-wrap">${post.content || ''}</p>
                    ${mediaHTML}
                    
                    <div class="flex items-center gap-6 mt-6 border-t border-slate-100 pt-4 text-slate-500 text-sm font-medium">
                        <button class="flex items-center gap-2 hover:text-red-500 transition" data-post-id="${post.id}">
                            <i data-lucide="heart" class="w-5 h-5"></i> <span>${likeCount}</span>
                        </button>
                        <button class="comment-btn flex items-center gap-2 hover:text-blue-500 transition" data-post-id="${post.id}">
                            <i data-lucide="message-circle" class="w-5 h-5"></i> <span>${commentCount}</span>
                        </button>
                        <button class="flex items-center gap-2 text-green-500 transition" data-post-id="${post.id}">
                            <i data-lucide="bookmark" class="w-5 h-5"></i> <span>Saved</span>
                        </button>
                    </div>
                
                    <div class="comment-section hidden mt-4 pt-4 border-t border-slate-100 bg-slate-50/50 rounded-xl p-4">
                        <div class="comments-list max-h-60 overflow-y-auto mb-4"></div>
                        <form class="comment-form flex gap-2 items-center" data-post-id="${post.id}">
                            <img src="${document.getElementById('nav-profile-img')?.src || 'src/assets/avatar-placeholder.png'}" 
                                 class="current-user-avatar w-8 h-8 rounded-full border border-slate-200 object-cover"
                                 onerror="this.src='src/assets/avatar-placeholder.png'">
                            <input type="text" placeholder="Write a comment..." class="flex-1 bg-white border border-slate-200 rounded-full px-4 py-2 text-sm focus:outline-none">
                            <button type="submit" class="text-brand-blue font-bold text-sm px-2">Post</button>
                        </form>
                    </div>
                </div>
            </div>`;
            return div;
        }

        // --- FETCH SAVED POSTS ---
        async function fetchSavedPosts() {
            if (!currentUser) return;

            const container = document.getElementById('saved-posts-container');
            const spinner = document.getElementById('loading-spinner');

            try {
                // 1. Get the IDs of all posts saved by the current user
                const { data: savedRelations, error: savedError } = await supabase
                    .from('saved_posts')
                    .select('post_id')
                    .eq('user_id', currentUser.uid);

                if (savedError) throw savedError;

                if (!savedRelations || savedRelations.length === 0) {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        You haven't saved any posts yet.
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                const postIds = savedRelations.map(r => r.post_id);

                // 2. Fetch the full post data for those IDs
                const { data: posts, error: postsError } = await supabase
                    .from('posts')
                    .select(`*, likes(count), comments(count), profiles(username, full_name, avatar_url)`)
                    .in('id', postIds)
                    .order('created_at', { ascending: false });

                if (postsError) throw postsError;

                container.innerHTML = ''; // Clear spinner

                if (posts && posts.length > 0) {
                    posts.forEach(post => {
                        const el = createPostElement(post);
                        container.appendChild(el);
                    });
                } else {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 border border-dashed border-slate-300 rounded-lg">
                        <i data-lucide="bookmark-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        Could not find the posts you saved. They may have been deleted.
                    </div>`;
                }

                lucide.createIcons();

            } catch (err) {
                console.error("Error fetching saved posts:", err);
                if (spinner) spinner.classList.add('hidden');
                container.innerHTML = `
                <div class="p-4 text-red-700 bg-red-100 rounded-lg">
                    <strong>Error:</strong> ${err.message}
                </div>`;
            }
        }

        // --- INIT ---
        onIdTokenChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // FIX: Use manual token setter to bypass Supabase Auth RS256 validation error
                await setSupabaseToken(await user.getIdToken());

                // Update nav bar avatar
                const photo = user.photoURL || 'src/assets/avatar-placeholder.png';
                const navImg = document.getElementById('nav-profile-img');
                if (navImg) navImg.src = photo;
                // Also update the bottom nav profile image
                const mobileNavImg = document.getElementById('mobile-nav-profile-img');
                if (mobileNavImg) mobileNavImg.src = photo;

                // Fetch the saved posts for this user
                fetchSavedPosts();
            } else {
                // Not logged in, redirect to login page
                window.location.href = 'Auth/login.html';
            }
        });

        // --- EVENTS (Copied from feed.html) ---
        const container = document.getElementById('saved-posts-container');
        if (container) {
            container.addEventListener('click', async (e) => {
                const btn = e.target.closest('button');
                if (!btn || !currentUser) return;
                const postId = btn.dataset.postId;

                // COMMENTS TOGGLE
                if (btn.classList.contains('comment-btn')) {
                    const card = btn.closest('.post-card');
                    const section = card.querySelector('.comment-section');
                    section.classList.toggle('hidden');
                    if (!section.classList.contains('hidden')) {
                        loadComments(postId, section.querySelector('.comments-list'));
                    }
                }

                // DELETE COMMENT logic
                if (btn.classList.contains('delete-comment-btn')) {
                    const commentId = btn.dataset.commentId;
                    if (confirm("Delete this comment?")) {
                        const { error } = await supabase.from('comments').delete().eq('id', commentId);
                        if (!error) {
                            // Remove comment from UI
                            const commentDiv = btn.closest('.comment-item');
                            if (commentDiv) commentDiv.remove();

                            // Update count
                            const postCard = btn.closest('.post-card');
                            const countSpan = postCard.querySelector('.comment-btn span');
                            if (countSpan) countSpan.textContent = Math.max(0, parseInt(countSpan.textContent) - 1);
                        } else {
                            alert("Error deleting comment: " + error.message);
                        }
                    }
                }
            });

            container.addEventListener('submit', async (e) => {
                if (e.target.classList.contains('comment-form')) {
                    e.preventDefault();
                    const form = e.target;
                    const input = form.querySelector('input');
                    const content = input.value.trim();
                    const postId = form.dataset.postId;

                    if (!content || !currentUser) return;
                    input.value = '';

                    const { error } = await supabase.from('comments').insert({
                        post_id: postId, user_id: currentUser.uid, content
                    });

                    if (!error) {
                        loadComments(postId, form.previousElementSibling);
                        const btnSpan = form.closest('.post-card').querySelector('.comment-btn span');
                        if (btnSpan) btnSpan.textContent = parseInt(btnSpan.textContent) + 1;
                    }
                }
            });
        }

        async function loadComments(postId, container) {
            container.innerHTML = '<div class="text-xs text-slate-400 p-2">Loading...</div>';
            const { data: comments } = await supabase.from('comments')
                .select('id, user_id, content, created_at, profiles(username, avatar_url)')
                .eq('post_id', postId).order('created_at', { ascending: true });

            container.innerHTML = '';
            if (!comments || !comments.length) {
                container.innerHTML = '<div class="text-xs text-slate-400 p-2">No comments yet.</div>';
                return;
            }

            comments.forEach(c => {
                const isOwner = currentUser && c.user_id === currentUser.uid;
                const deleteBtn = isOwner ? `
                    <button class="delete-comment-btn text-slate-400 hover:text-red-500 transition p-1" title="Delete Comment" data-comment-id="${c.id}">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>` : '';

                const div = document.createElement('div');
                div.className = "comment-item flex gap-2 mb-2 text-sm group";
                div.innerHTML = `
                <img src="${c.profiles?.avatar_url || 'src/assets/avatar-placeholder.png'}" class="w-6 h-6 rounded-full mt-1 object-cover">
                <div class="flex-1">
                    <div class="bg-slate-50 p-2 rounded-lg relative">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-slate-900 text-xs">${c.profiles?.username || 'User'}</span>
                            ${deleteBtn}
                        </div>
                        <p class="text-slate-700 mt-1">${c.content}</p>
                    </div>
                </div>`;
                container.appendChild(div);
            });
            lucide.createIcons({ nodes: [container] });
        }

        lucide.createIcons();
    </script>
</body>

</html>
