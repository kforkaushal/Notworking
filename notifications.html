<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - NotWorking</title>
    <meta name="description" content="See who is ignoring your work.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/notifications.html">
    <meta property="og:title" content="Notifications - NotWorking">
    <meta property="og:description" content="See who is ignoring your work.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/notifications.html">
    <meta property="twitter:title" content="Notifications - NotWorking">
    <meta property="twitter:description" content="See who is ignoring your work.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/notifications.html" />

    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="feed.html"><img src="src/assets/logo.svg" class="h-10 w-auto" alt="logo" /></a>
            <div class="hidden md:flex items-center gap-4">
                <a href="feed.html" class="text-slate-500 hover:text-brand-blue font-bold text-sm">Back to Feed</a>
                <a href="profile.html">
                    <img id="nav-profile-img" src="src/assets/avatar-placeholder.png"
                        class="w-8 h-8 rounded-full border border-slate-200" />
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 pt-8 pb-28">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Notifications</h1>
                <p class="text-slate-500 mt-1">Updates on your inactivity.</p>
            </div>
            <button id="mark-all-read-btn" class="text-sm font-bold text-brand-blue hover:underline">Mark all as
                read</button>
        </div>

        <div id="notifications-container" class="space-y-4">
            <div class="text-center py-10">
                <i data-lucide="loader-2" class="w-8 h-8 text-slate-400 animate-spin mx-auto"></i>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <!-- Mobile Bottom Nav Container -->
    <div id="mobile-nav-container"></div>

    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { escapeHtml, injectMobileBottomNav } from './shared/ui.js';

        // Initialize mobile bottom nav
        injectMobileBottomNav('none');

        let currentUser = null;

        // ─── ICON / TEXT MAP ─────────────────────────────────────────────────────
        function getNotifMeta(type, post, actorName) {
            const escapedActor = escapeHtml(actorName);
            const preview = post?.content ? `"${escapeHtml(post.content.substring(0, 40))}${post.content.length > 40 ? '…' : ''}"` : 'your post';
            if (type === 'like') return {
                text: `<span class="font-bold">${escapedActor}</span> liked ${preview}`,
                badge: `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-red-500 border-2 border-white absolute -bottom-1 -right-1"><i data-lucide="heart" class="w-3 h-3 text-white"></i></span>`,
                dot: 'bg-red-500'
            };
            if (type === 'comment') return {
                text: `<span class="font-bold">${escapedActor}</span> commented on ${preview}`,
                badge: `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-blue-500 border-2 border-white absolute -bottom-1 -right-1"><i data-lucide="message-circle" class="w-3 h-3 text-white"></i></span>`,
                dot: 'bg-blue-500'
            };
            if (type === 'follow') return {
                text: `<span class="font-bold">${escapedActor}</span> started following you.`,
                badge: `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-900 border-2 border-white absolute -bottom-1 -right-1"><i data-lucide="user-plus" class="w-3 h-3 text-white"></i></span>`,
                dot: 'bg-slate-700'
            };
            return { text: `<span class="font-bold">${escapedActor}</span> did something.`, badge: '', dot: 'bg-slate-400' };
        }

        function buildNotifEl(n, isNew = false) {
            const avatar = n.actor?.avatar_url || 'src/assets/avatar-placeholder.png';
            const actorName = n.actor?.full_name || 'Someone';
            const username = n.actor?.username || '';
            const meta = getNotifMeta(n.type, n.post, actorName);
            const href = (n.type === 'like' || n.type === 'comment') && n.post_id
                ? `feed.html?post_id=${n.post_id}`
                : n.type === 'follow' ? `profile.html?username=${username}` : 'feed.html';

            const el = document.createElement('a');
            el.href = href;
            el.id = `notif-${n.id}`;
            el.className = `block p-4 bg-white rounded-xl border flex gap-4 items-center hover:bg-slate-50 transition ${n.is_read ? 'border-slate-200 opacity-70' : 'border-blue-200 bg-blue-50/30'}`;
            el.innerHTML = `
                <div class="relative flex-shrink-0">
                    <img src="${avatar}" class="w-12 h-12 rounded-full object-cover border border-slate-200"
                         onerror="this.src='src/assets/avatar-placeholder.png'">
                    ${meta.badge}
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm text-slate-900 leading-snug">${meta.text}</p>
                    <p class="text-xs text-slate-400 mt-1">${new Date(n.created_at).toLocaleString()}</p>
                </div>
                ${isNew ? `<span class="flex-shrink-0 text-xs bg-blue-500 text-white font-bold px-2 py-0.5 rounded-full">New</span>` : (!n.is_read ? `<span class="flex-shrink-0 w-2.5 h-2.5 ${meta.dot} rounded-full"></span>` : '')}
            `;
            return el;
        }

        // ─── INIT ────────────────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const token = await user.getIdToken();
                setSupabaseToken(token);

                // Verify profile completeness
                let profile = null;
                try {
                    const { data } = await supabase.from('profiles')
                        .select('username, full_name, avatar_url, bio, experience, skills')
                        .eq('id', user.uid)
                        .maybeSingle();
                    profile = data;
                } catch (e) {
                    console.error("Error checking profile in notifications.html:", e);
                }

                if (!profile || !profile.username) {
                    console.log("Profile incomplete or missing. Redirecting to setup.html...");
                    window.location.href = 'Auth/setup.html';
                    return;
                }

                const photo = profile.avatar_url || 'src/assets/avatar-placeholder.png';
                document.getElementById('nav-profile-img').src = photo;
                const mobileImg = document.getElementById('mobile-nav-profile-img');
                if (mobileImg) mobileImg.src = photo;

                await fetchNotifications();

                // Mark all as read when the user is on this page
                await supabase.from('notifications')
                    .update({ is_read: true })
                    .eq('user_id', user.uid)
                    .eq('is_read', false);

                // ── REALTIME: new notifications appear at top instantly ──
                supabase.channel(`notif-page:${user.uid}`)
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'notifications',
                        filter: `user_id=eq.${user.uid}`
                    }, async (payload) => {
                        const n = payload.new;

                        // Enrich with actor + post data
                        const [{ data: actor }, { data: post }] = await Promise.all([
                            supabase.from('profiles').select('full_name, username, avatar_url').eq('id', n.actor_id).single(),
                            n.post_id
                                ? supabase.from('posts').select('content').eq('id', n.post_id).single()
                                : Promise.resolve({ data: null })
                        ]);

                        const enriched = { ...n, actor, post, is_read: false };
                        const container = document.getElementById('notifications-container');

                        // Remove empty state if present
                        const empty = container.querySelector('[data-empty]');
                        if (empty) empty.remove();

                        // Prepend the new notification
                        const el = buildNotifEl(enriched, true);
                        container.prepend(el);
                        lucide.createIcons({ nodes: [el] });

                        // Mark it read after 5s (user is already on the page)
                        setTimeout(async () => {
                            await supabase.from('notifications').update({ is_read: true }).eq('id', n.id);
                        }, 5000);
                    })
                    .subscribe();

            } else {
                window.location.href = 'Auth/login.html';
            }
        });

        // ─── FETCH NOTIFICATIONS ─────────────────────────────────────────────────
        async function fetchNotifications() {
            const container = document.getElementById('notifications-container');
            container.innerHTML = `<div class="flex justify-center py-10"><i data-lucide="loader-2" class="w-8 h-8 text-slate-400 animate-spin"></i></div>`;
            lucide.createIcons();

            const { data: notifications, error } = await supabase
                .from('notifications')
                .select(`
                    id, type, created_at, is_read, post_id,
                    actor:profiles!actor_id (username, full_name, avatar_url),
                    post:posts!post_id (content)
                `)
                .eq('user_id', currentUser.uid)
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                console.error('Error fetching notifications:', error);
                if (error.code === '42P01') {
                    container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 bg-white rounded-xl border border-slate-200">
                        <i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        <p class="font-bold">Run <code class="bg-slate-100 px-1 rounded text-sm">schema_update.sql</code> first</p>
                        <p class="text-xs mt-2 text-slate-400">The notifications table doesn't exist yet.</p>
                    </div>`;
                } else {
                    container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg text-sm">
                        <strong>Error:</strong> ${error.message}<br>
                        <span class="text-xs text-red-400">Code: ${error.code}</span>
                    </div>`;
                }
                lucide.createIcons();
                return;
            }

            if (!notifications || notifications.length === 0) {
                container.innerHTML = `
                <div data-empty class="text-center py-16 text-slate-500 bg-white rounded-xl border border-slate-200">
                    <i data-lucide="bell" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
                    <p class="font-bold text-slate-700">All quiet here</p>
                    <p class="text-sm mt-1">No notifications yet. Go take a nap.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';
            notifications.forEach(n => {
                const el = buildNotifEl(n, false);
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        // ─── MARK ALL READ ───────────────────────────────────────────────────────
        document.getElementById('mark-all-read-btn').addEventListener('click', async () => {
            const { error } = await supabase.from('notifications')
                .update({ is_read: true })
                .eq('user_id', currentUser.uid);

            if (!error) {
                // Visually mark all as read without refetch
                document.querySelectorAll('#notifications-container > a').forEach(el => {
                    el.classList.remove('border-blue-200', 'bg-blue-50/30');
                    el.classList.add('border-slate-200', 'opacity-70');
                    // Remove the unread dot
                    el.querySelector('span.rounded-full:last-child')?.remove();
                });
            }
        });

        lucide.createIcons();
    </script>

</body>

</html>
