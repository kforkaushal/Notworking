    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { showToast, escapeHtml, injectMobileBottomNav } from './shared/ui.js';

        // Initialize mobile bottom nav
        injectMobileBottomNav('messages');

        let currentUser = null;
        let activeConversationUserId = null;
        let activeConversationUserName = '';
        let activeConversationUserAvatar = '';
        let messageSubscription = null;
        let typingTimeout;
        let searchTimeout;
        const convosList = document.getElementById('conversations-list');
        const chatWindow = document.getElementById('chat-window');

        // --- CALLING STATES ---
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let callSessionId = null;
        let callSessionChannel = null;
        let userCallsChannel = null;
        let globalMessagesChannel = null;
        let isCaller = false;
        let activeCallType = null; // 'audio' or 'video'
        let callTimerInterval = null;
        let callStartTime = null;
        let isMicMuted = false;
        let isCamOff = false;
        let callTimeout = null;
        let currentUserProfile = null;
        let callLogged = false;

        const peerConfiguration = {
            iceServers: [
                {
                    urls: [
                        'stun:stun.l.google.com:19302',
                        'stun:stun1.l.google.com:19302',
                        'stun:stun2.l.google.com:19302'
                    ]
                }
            ]
        };

        // --- Web Audio API Ringtone / Dialtone Generators ---
        let ringCtx = null;
        let ringInterval = null;

        function startDialtone() {
            stopRinging();
            ringCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playTone() {
                if (!ringCtx || ringCtx.state === 'closed') return;
                const osc1 = ringCtx.createOscillator();
                const osc2 = ringCtx.createOscillator();
                const gainNode = ringCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(440, ringCtx.currentTime);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(480, ringCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.02, ringCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1.5);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ringCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(ringCtx.currentTime + 1.5);
                osc2.stop(ringCtx.currentTime + 1.5);
            }
            playTone();
            ringInterval = setInterval(playTone, 3000);
        }

        function startRingtone() {
            stopRinging();
            ringCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playTone() {
                if (!ringCtx || ringCtx.state === 'closed') return;
                const osc1 = ringCtx.createOscillator();
                const osc2 = ringCtx.createOscillator();
                const gainNode = ringCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(853, ringCtx.currentTime);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(960, ringCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.03, ringCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1.2);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ringCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(ringCtx.currentTime + 1.2);
                osc2.stop(ringCtx.currentTime + 1.2);
            }
            playTone();
            ringInterval = setInterval(playTone, 2000);
        }

        function stopRinging() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
            if (ringCtx) {
                try {
                    ringCtx.close();
                } catch (e) {}
                ringCtx = null;
            }
        }

        // --- DATABASE CALL LOGGING ---
        async function logCallToDatabase(type, status, durationSecs = null) {
            if (callLogged || !isCaller || !currentUser || !activeConversationUserId) return;
            callLogged = true;

            let icon = type === 'video' ? '📹' : '📞';
            let label = type === 'video' ? 'Video call' : 'Voice call';
            let content = '';

            if (status === 'completed' && durationSecs !== null) {
                const mins = String(Math.floor(durationSecs / 60)).padStart(2, '0');
                const secs = String(durationSecs % 60).padStart(2, '0');
                content = `${icon} ${label} ended • ${mins}:${secs}`;
            } else if (status === 'declined') {
                content = `${icon} ${label} declined`;
            } else if (status === 'busy') {
                content = `${icon} ${label} • User busy`;
            } else if (status === 'cancelled') {
                content = `${icon} Missed ${label.toLowerCase()}`;
            } else if (status === 'no-answer') {
                content = `${icon} ${label} • No answer`;
            }

            if (!content) return;

            const logPayload = {
                sender_id: currentUser.uid,
                receiver_id: activeConversationUserId,
                content: content
            };

            const { error } = await supabase.from('messages').insert(logPayload);
            if (error) {
                console.error("Error logging call to database:", error);
            }
        }

        // --- CALL TIMER LOGIC ---
        function startCallTimer() {
            const timerEl = document.getElementById('call-timer');
            timerEl.classList.remove('hidden');
            document.getElementById('call-status').textContent = 'Connected';
            document.getElementById('call-avatar-ring').classList.add('hidden');
            
            callStartTime = Date.now();
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                const elapsedSecs = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = String(Math.floor(elapsedSecs / 60)).padStart(2, '0');
                const secs = String(elapsedSecs % 60).padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // --- CALL CLEANUP ---
        function cleanupCall() {
            stopRinging();
            if (callTimeout) {
                clearTimeout(callTimeout);
                callTimeout = null;
            }
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (callSessionChannel) {
                supabase.removeChannel(callSessionChannel);
                callSessionChannel = null;
            }

            // Reset UI
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('local-video').classList.add('hidden');
            document.getElementById('remote-video').classList.add('hidden');
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('remote-audio').srcObject = null;
            document.getElementById('call-timer').classList.add('hidden');
            document.getElementById('call-timer').textContent = '00:00';
            document.getElementById('call-avatar-ring').classList.add('hidden');

            // Restore hidden UI elements for future calls
            document.getElementById('call-avatar-wrapper').classList.remove('hidden');
            document.getElementById('call-user-name').classList.remove('hidden');
            document.getElementById('call-status').classList.add('animate-pulse');
            document.getElementById('call-status').textContent = 'Calling...';

            // Reset mute states and icons
            isMicMuted = false;
            isCamOff = false;
            const micBtn = document.getElementById('toggle-mic-btn');
            micBtn.innerHTML = `<i data-lucide="mic" class="w-5 h-5 text-white"></i>`;
            micBtn.className = 'p-3 bg-white/10 hover:bg-white/20 rounded-full transition';
            
            const camBtn = document.getElementById('toggle-cam-btn');
            camBtn.innerHTML = `<i data-lucide="video" class="w-5 h-5 text-white"></i>`;
            camBtn.className = 'p-3 bg-white/10 hover:bg-white/20 rounded-full transition hidden';

            callSessionId = null;
            remoteStream = null;
            isCaller = false;
            activeCallType = null;
            callLogged = false;
            lucide.createIcons();
        }

        // --- CALL RINGING SIGNAL ---
        function handleCallRingingSignal(envelope) {
            const payload = envelope.payload;
            if (isCaller && callSessionId === payload.callSessionId) {
                document.getElementById('call-status').textContent = 'Ringing...';
            }
        }

        // --- INCOMING CALL SIGNAL ---
        async function handleIncomingCallSignal(envelope) {
            const payload = envelope.payload;
            
            // Send call-ringing feedback broadcast back to caller
            const callerChannelName = `user-calls:${payload.callerId}`;
            const callerChannel = supabase.channel(callerChannelName);
            callerChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    callerChannel.send({
                        type: 'broadcast',
                        event: 'call-ringing',
                        payload: { callSessionId: payload.callSessionId }
                    }).then(() => {
                        supabase.removeChannel(callerChannel);
                    });
                }
            });

            if (callSessionId) {
                const busyChannel = supabase.channel(`call-session:${payload.callSessionId}`);
                busyChannel.subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        busyChannel.send({
                            type: 'broadcast',
                            event: 'call-busy'
                        }).then(() => {
                            supabase.removeChannel(busyChannel);
                        });
                    }
                });
                return;
            }

            startRingtone();

            callSessionId = payload.callSessionId;
            activeCallType = payload.callType;
            isCaller = false;

            document.getElementById('call-avatar').src = payload.callerAvatar || 'src/assets/avatar-placeholder.png';
            document.getElementById('call-user-name').textContent = payload.callerName;
            document.getElementById('call-status').textContent = `Incoming ${activeCallType === 'video' ? 'Video' : 'Voice'} Call...`;
            document.getElementById('call-avatar-ring').classList.remove('hidden');

            document.getElementById('incoming-actions').classList.remove('hidden');
            document.getElementById('ongoing-actions').classList.add('hidden');
            
            const camBtn = document.getElementById('toggle-cam-btn');
            if (activeCallType === 'video') {
                camBtn.classList.remove('hidden');
            } else {
                camBtn.classList.add('hidden');
            }

            document.getElementById('call-modal').classList.remove('hidden');
            lucide.createIcons();

            callSessionChannel = supabase.channel(`call-session:${callSessionId}`)
                .on('broadcast', { event: 'call-cancelled' }, () => {
                    showToast('Call cancelled by caller', 'info');
                    cleanupCall();
                })
                .on('broadcast', { event: 'call-ended' }, () => {
                    showToast('Call ended', 'info');
                    cleanupCall();
                })
                .on('broadcast', { event: 'webrtc-offer' }, handleWebRTCOffer)
                .on('broadcast', { event: 'webrtc-ice' }, handleWebRTCIce)
                .subscribe();
        }

        // --- OUTGOING CALL INITIATION ---
        async function startCall(type) {
            if (!activeConversationUserId) return;
            if (callSessionId) return;

            isCaller = true;
            activeCallType = type;
            callSessionId = Math.random().toString(36).substring(2, 15) + Date.now().toString(36);

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video' ? { width: 640, height: 480 } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.error("Error accessing media devices:", err);
                showToast("Could not access camera/microphone. Please check permissions.", "error");
                return;
            }

            startDialtone();

            callSessionChannel = supabase.channel(`call-session:${callSessionId}`)
                .on('broadcast', { event: 'call-accepted' }, handleCallAccepted)
                .on('broadcast', { event: 'call-declined' }, () => {
                    showToast('Call declined', 'info');
                    logCallToDatabase(activeCallType, 'declined');
                    cleanupCall();
                })
                .on('broadcast', { event: 'call-busy' }, () => {
                    showToast('User is busy', 'info');
                    logCallToDatabase(activeCallType, 'busy');
                    cleanupCall();
                })
                .on('broadcast', { event: 'call-ended' }, () => {
                    showToast('Call ended', 'info');
                    if (isCaller && callStartTime) {
                        const durationSecs = Math.floor((Date.now() - callStartTime) / 1000);
                        logCallToDatabase(activeCallType, 'completed', durationSecs);
                    }
                    cleanupCall();
                })
                .on('broadcast', { event: 'webrtc-answer' }, handleWebRTCAnswer)
                .on('broadcast', { event: 'webrtc-ice' }, handleWebRTCIce)
                .subscribe();

            document.getElementById('call-avatar').src = activeConversationUserAvatar || 'src/assets/avatar-placeholder.png';

            document.getElementById('incoming-actions').classList.add('hidden');
            document.getElementById('ongoing-actions').classList.remove('hidden');

            } else {

            }

            lucide.createIcons();

            const calleeChannelName = `user-calls:${activeConversationUserId}`;
            const calleeChannel = supabase.channel(calleeChannelName);
            calleeChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    calleeChannel.send({
                        type: 'broadcast',
                        event: 'incoming-call',
                        payload: {
                            callerId: currentUser.uid,
                            callerName: currentUserProfile?.full_name || 'Someone',
                            callerAvatar: currentUserProfile?.avatar_url || '',
                            callType: activeCallType,
                            callSessionId: callSessionId
                        }
                    }).then(() => {
                        supabase.removeChannel(calleeChannel);
                    });
                }
            });

            callTimeout = setTimeout(() => {
                showToast("No answer", "info");
                logCallToDatabase(activeCallType, 'no-answer');
                cancelCall();
            }, 30000);

        // --- ACCEPT CALL ---
        async function acceptCall() {
            stopRinging();
            document.getElementById('incoming-actions').classList.add('hidden');
            document.getElementById('ongoing-actions').classList.remove('hidden');
            document.getElementById('call-status').textContent = 'Connecting...';

            try {
                const constraints = {
                    audio: true,
                    video: activeCallType === 'video' ? { width: 640, height: 480 } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.error("Error accessing media devices:", err);
                showToast("Could not access camera/microphone. Call failed.", "error");
                declineCall();
                return;
            }

            if (activeCallType === 'video') {
                const localVideo = document.getElementById('local-video');
                localVideo.classList.remove('hidden');
                localVideo.srcObject = localStream;
            }

            callSessionChannel.send({
                type: 'broadcast',
                event: 'call-accepted'
            });
        }

        // --- DECLINE CALL ---
        function declineCall() {
            if (callSessionChannel) {
                callSessionChannel.send({
                    type: 'broadcast',
                    event: 'call-declined'

            cleanupCall();
        }

        // --- CANCEL CALL (CALLER) ---
        function cancelCall() {
            logCallToDatabase(activeCallType, 'cancelled');
            const calleeChannelName = `user-calls:${activeConversationUserId}`;
            const calleeChannel = supabase.channel(calleeChannelName);
            calleeChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    calleeChannel.send({
                        type: 'broadcast',
                        event: 'call-cancelled',
                        payload: { callSessionId: callSessionId }
                    }).then(() => {
                        supabase.removeChannel(calleeChannel);
                    });
                }
            });
            cleanupCall();
        }

        // --- END ONGOING CALL ---
        function endOngoingCall() {
            if (isCaller && callStartTime) {
                const durationSecs = Math.floor((Date.now() - callStartTime) / 1000);
                logCallToDatabase(activeCallType, 'completed', durationSecs);
            }
            if (callSessionChannel) {
                callSessionChannel.send({
                    type: 'broadcast',
                    event: 'call-ended'
                });
            }
            cleanupCall();
        }

        // --- WEBRTC OFFER/ANSWER AND ICE HANDLING ---
        function initWebRTCPeer() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(peerConfiguration);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && callSessionChannel) {
                    callSessionChannel.send({
                        type: 'broadcast',
                        event: 'webrtc-ice',
                        payload: { candidate: event.candidate }
                    });
                }
            };

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    remoteStream = event.streams[0];
                    if (activeCallType === 'video') {
                        const remoteVideo = document.getElementById('remote-video');
                        remoteVideo.classList.remove('hidden');
                        remoteVideo.srcObject = remoteStream;

                        // Premium UI/UX: Hide large avatar and centering info during active video feed
                        document.getElementById('call-avatar-wrapper').classList.add('hidden');
                        document.getElementById('call-user-name').classList.add('hidden');
                        document.getElementById('call-status').textContent = 'Video Connected';
                        document.getElementById('call-status').classList.remove('animate-pulse');
                    } else {
                        const remoteAudio = document.getElementById('remote-audio');
                        remoteAudio.srcObject = remoteStream;

                        // Audio Connected State UI
                        document.getElementById('call-status').textContent = 'Connected';
                        document.getElementById('call-status').classList.remove('animate-pulse');
                        document.getElementById('call-avatar-ring').classList.add('hidden');
                    }
                    startCallTimer();
                }
            };
        }

        function handleCallAccepted() {
            stopRinging();
            if (callTimeout) clearTimeout(callTimeout);
            document.getElementById('call-status').textContent = 'Connecting...';

            initWebRTCPeer();

            peerConnection.createOffer().then(offer => {
                return peerConnection.setLocalDescription(offer);
            }).then(() => {
                callSessionChannel.send({
                    type: 'broadcast',
                    event: 'webrtc-offer',
                    payload: { sdp: peerConnection.localDescription }
                });
            }).catch(err => {
                console.error("Failed to create offer:", err);
                endOngoingCall();
            });
        }

        function handleWebRTCOffer(envelope) {
            const payload = envelope.payload;
            initWebRTCPeer();

            peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp))
                .then(() => {
                    return peerConnection.createAnswer();
                })
                .then(answer => {
                    return peerConnection.setLocalDescription(answer);
                })
                .then(() => {
                    callSessionChannel.send({
                        type: 'broadcast',
                        event: 'webrtc-answer',
                        payload: { sdp: peerConnection.localDescription }
                    });
                })
                .catch(err => {
                    console.error("Failed to set offer or create answer:", err);
                    endOngoingCall();
                });
        }

        function handleWebRTCAnswer(envelope) {
            const payload = envelope.payload;
            if (peerConnection) {
                peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp))
                    .catch(err => {
                        console.error("Failed to set remote description (answer):", err);
                        endOngoingCall();
                    });
            }
        }

        function handleWebRTCIce(envelope) {
            const payload = envelope.payload;
            if (peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate))
                    .catch(err => console.error("Error adding ice candidate:", err));
            }
        }

        async function loadConversation(otherUserId, name, username, avatar) {
            // 1. Mark messages as read
            await supabase
                .from('messages')
                .update({ is_read: true })
                .eq('sender_id', otherUserId)
                .eq('receiver_id', currentUser.uid);

            // Remove badge
            document.querySelector(`[data-user-id="${otherUserId}"] .unread-badge`)?.remove();

            activeConversationUserId = otherUserId;
            activeConversationUserName = name;
            activeConversationUserAvatar = avatar || '';
            showChatWindow();

            // Unsubscribe from previous channel
            if (messageSubscription) {
                supabase.removeChannel(messageSubscription);
            }

            // UI Updates
            document.getElementById('chat-placeholder').classList.add('hidden');
            document.getElementById('active-chat-container').classList.remove('hidden');
            document.getElementById('active-chat-container').classList.add('flex');
            document.getElementById('chat-header-avatar').src = avatar || 'src/assets/avatar-placeholder.png';
            document.getElementById('chat-header-name').textContent = name;
            document.getElementById('chat-header-username').textContent = `@${username}`;

            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '<div class="p-4 text-center text-slate-400">Loading messages...</div>';

            // 2. Fetch History
            const { data: messages, error } = await supabase
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.uid},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.uid})`)
                .order('created_at', { ascending: true });

            messagesContainer.innerHTML = '';
            if (messages) {
                messages.forEach(msg => {
                    const isSender = msg.sender_id === currentUser.uid;
                    messagesContainer.appendChild(createMessageElement(msg, isSender));
                });
                scrollToBottom();
            }

            // 3. REALTIME SETUP (Using Database Triggers)
            // We listen for any new rows in the 'messages' table.
            // The filter ensures we only get notified about messages relevant to THIS conversation.
            // Create a unique, consistent channel name for the conversation
            const channelName = [currentUser.uid, otherUserId].sort().join('-');

            messageSubscription = supabase.channel(`messages:${channelName}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    // Corrected filter syntax
                    filter: `receiver_id=eq.${currentUser.uid}`
                }, payload => {
                    const newMessage = payload.new;

                    // Prevent duplicate rendering from optimistic UI
                    if (document.querySelector(`[data-message-id="${newMessage.id}"]`)) return;

                    // We only want to display the message if it was sent by the OTHER user in this active chat.
                    if (newMessage.sender_id === activeConversationUserId) {
                        // Hide typing indicator when a message arrives
                        document.getElementById('typing-indicator').classList.add('hidden');
                        messagesContainer.appendChild(createMessageElement(newMessage, false));
                        scrollToBottom();
                    }
                })
                .subscribe();
        }

                    .subscribe();

                // Load user's conversations
                await loadConversations();

                // Realtime updates for profile updates (e.g. avatar or name changes)
                supabase.channel('public:profiles').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, (payload) => {
                    const updatedProfile = payload.new;
                    if (updatedProfile && updatedProfile.id) {
                        const newAvatar = updatedProfile.avatar_url || 'src/assets/avatar-placeholder.png';
                        const newName = updatedProfile.full_name || 'Anonymous';

                        // 1. Update matching conversation item in the sidebar list

                        // 2. If it's the active chat, update header
                        if (activeConversationUserId === updatedProfile.id) {
                            const headerAvatar = document.getElementById('chat-header-avatar');
                            if (headerAvatar) headerAvatar.src = newAvatar;

                            const headerName = document.getElementById('chat-header-name');
                            if (headerName) headerName.textContent = newName;
                        }

                        // 3. If it's the current user updating their own profile, update navbar avatar
                        if (updatedProfile.id === user.uid) {
                            const navImg = document.getElementById('nav-profile-img');
                            if (navImg) navImg.src = newAvatar;
                        }
                    }
                }).subscribe();

                // Set up a global listener for ANY incoming message
                if (globalMessagesChannel) {
                    supabase.removeChannel(globalMessagesChannel);
                }
                globalMessagesChannel = supabase.channel('public:messages:all')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `receiver_id=eq.${user.uid}`
                    }, async (payload) => {
                        const newMessage = payload.new;
                        const isActiveConversation = newMessage.sender_id === activeConversationUserId;

                        // Find the conversation item in the sidebar
                        const convoItem = document.querySelector(`[data-user-id="${newMessage.sender_id}"]`);

                        // 1. Update the "last message" text in the sidebar
                        if (convoItem) {
                            const lastMessageEl = convoItem.querySelector('.last-message');
                            if (lastMessageEl) {
                                lastMessageEl.textContent = newMessage.content;
                            }
                            // Move the conversation to the top of the list
                            convoItem.parentElement.prepend(convoItem);
                        } else {
                            // If it's a brand new conversation, we must reload the whole list
                            await loadConversations();
                            return; // Exit early since the list is rebuilt
                        }

                        // 2. Handle Notifications & Unread Badges
                        if (!isActiveConversation) {
                            // If we are NOT talking to them, play a sound and show a notification
                            playSound();
                            // (Desktop notification logic is already here and correct)
                        } else {
                            // If we ARE talking to them, mark it as read immediately 
                            // This prevents the unread count from incrementing on the next page load
                            await supabase.from('messages').update({ is_read: true }).eq('id', newMessage.id);
                        }
                    })
                    .subscribe();

                // Check if URL has a 'user' param to auto-open a conversation
                const params = new URLSearchParams(window.location.search);
                const userIdToOpen = params.get('user');
                if (userIdToOpen) {
                    const { data: profileToOpen, error } = await supabase.from('profiles').select('*').eq('id', userIdToOpen).single();
                    if (profileToOpen) {
                        loadConversation(profileToOpen.id, profileToOpen.full_name, profileToOpen.username, profileToOpen.avatar_url);
                    }
                }

            } else {
                if (userCallsChannel) {
                    supabase.removeChannel(userCallsChannel);
                    userCallsChannel = null;
                }
                if (globalMessagesChannel) {
                    supabase.removeChannel(globalMessagesChannel);
                    globalMessagesChannel = null;
                }
                window.location.href = 'Auth/login.html';
            }
        });

        lucide.createIcons();

    </script>
</body>

</html>
