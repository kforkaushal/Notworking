<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - NotWorking</title>
    <meta name="description" content="Find your tribe of procrastinators.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/groups.html">
    <meta property="og:title" content="Groups - NotWorking">
    <meta property="og:description" content="Find your tribe of procrastinators.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/groups.html">
    <meta property="twitter:title" content="Groups - NotWorking">
    <meta property="twitter:description" content="Find your tribe of procrastinators.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/groups.html" />

    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="feed.html"><img src="src/assets/logo.svg" class="h-10 w-auto" alt="logo" /></a>
            <div class="hidden sm:flex items-center gap-4">
                <a href="notifications.html"
                    class="text-slate-500 hover:text-brand-blue font-bold text-sm">Notifications</a>
                <a href="feed.html" class="text-slate-500 hover:text-brand-blue font-bold text-sm">Back to Feed</a>
                <a href="profile.html">
                    <img id="nav-profile-img" src="src/assets/avatar-placeholder.png"
                        class="w-8 h-8 rounded-full border border-slate-200" />
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Groups</h1>
                <p class="text-slate-500 mt-1">Find people who are equally unproductive.</p>
            </div>
            <button id="create-group-btn"
                class="px-4 py-2 bg-slate-900 text-white font-bold rounded-full hover:bg-black transition">
                Create Group
            </button>
        </div>

        <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20">
                <i data-lucide="loader-2" class="w-12 h-12 text-slate-400 animate-spin mx-auto"></i>
            </div>
        </div>
    </main>

    <!-- CREATE GROUP MODAL -->
    <div id="create-group-modal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-scale-up">
            <h2 class="text-2xl font-bold mb-4">Create a New Tribe</h2>
            <form id="create-group-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Group Name</label>
                    <input type="text" id="group-name" required placeholder="e.g. Laid Off 2024"
                        class="mt-1 w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Description</label>
                    <textarea id="group-desc" required rows="3" placeholder="What is this group about?"
                        class="mt-1 w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <!-- Image Upload can be V2 -->
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="cancel-group-btn"
                        class="px-4 py-2 text-slate-600 hover:text-slate-900 font-bold">Cancel</button>
                    <button type="submit"
                        class="px-6 py-2 bg-slate-900 text-white font-bold rounded-lg hover:bg-black transition">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <div class="mobile-bottom-nav shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <a href="feed.html" class="mobile-nav-item">
            <i data-lucide="home"></i>
            <span>Home</span>
        </a>
        <a href="groups.html" class="mobile-nav-item active text-brand-blue">
            <i data-lucide="users-2"></i>
            <span>Groups</span>
        </a>
        <a href="save.html" class="mobile-nav-item">
            <i data-lucide="bookmark"></i>
            <span>Saved</span>
        </a>
        <a href="messages.html" class="mobile-nav-item relative">
            <i data-lucide="message-square"></i>
            <span>Msgs</span>
            <span id="mobile-msg-badge" class="hidden absolute top-0 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <img id="mobile-nav-profile-img" src="src/assets/avatar-placeholder.png"
                class="w-6 h-6 rounded-full border border-slate-200">
            <span>Profile</span>
        </a>
    </div>

    <script type="module">
        import { auth } from './Data/firebase-client.js';
        import supabase, { setSupabaseToken } from './Data/supabase-client.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { showToast } from './shared/ui.js';

        let currentUser = null;

        // --- INIT ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await setSupabaseToken(await user.getIdToken());
                const photo = user.photoURL || 'src/assets/avatar-placeholder.png';
                document.getElementById('nav-profile-img').src = photo;
                const mobileNavImg = document.getElementById('mobile-nav-profile-img');
                if (mobileNavImg) mobileNavImg.src = photo;
                fetchGroups();
            } else {
                window.location.href = 'Auth/login.html';
            }
        });

        async function fetchGroups() {
            const container = document.getElementById('groups-container');

            const { data: groups, error } = await supabase
                .from('groups')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching groups:', error);
                if (error.code === '42P01') { // Undefined table
                    container.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-xl border border-slate-200">
                        <i data-lucide="file-warning" class="w-12 h-12 text-slate-300 mx-auto mb-4"></i>
                        <h3 class="text-xl font-bold text-slate-900">System Update Required</h3>
                        <p class="text-slate-500 mt-2">The 'groups' table hasn't been created yet.</p>
                    </div>`;
                    lucide.createIcons();
                    return;
                }
                container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg col-span-full">Error loading groups.</div>`;
                return;
            }

            if (!groups || groups.length === 0) {
                container.innerHTML = `
                <div class="col-span-full text-center py-20 bg-white rounded-xl border border-slate-200">
                    <i data-lucide="users-2" class="w-12 h-12 text-slate-300 mx-auto mb-4"></i>
                    <h3 class="text-xl font-bold text-slate-900">No Groups Yet</h3>
                    <p class="text-slate-500 mt-2">Be the pioneer. Create the first group.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';
            groups.forEach(group => {
                const div = document.createElement('div');
                div.className = "bg-white p-6 rounded-xl border border-slate-200 hover:shadow-lg transition flex flex-col items-start";

                // Random gradient for group placeholder if no image
                const gradients = [
                    'bg-gradient-to-br from-blue-400 to-indigo-600',
                    'bg-gradient-to-br from-red-400 to-pink-600',
                    'bg-gradient-to-br from-green-400 to-teal-600',
                    'bg-gradient-to-br from-yellow-400 to-orange-600'
                ];
                const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];

                div.innerHTML = `
                    <div class="w-12 h-12 rounded-lg ${randomGradient} mb-4 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        ${group.name.substring(0, 2).toUpperCase()}
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 mb-1 leading-tight">${group.name}</h3>
                    <p class="text-slate-500 text-sm mb-4 line-clamp-2 min-h-[40px]">${group.description}</p>
                    
                    <a href="feed.html?group_id=${group.id}" class="mt-auto w-full py-2 bg-slate-50 text-slate-700 font-bold rounded-lg hover:bg-slate-100 hover:text-brand-blue transition text-center border border-slate-100">
                        View Group
                    </a>
                `;
                container.appendChild(div);
            });
        }

        // --- CREATE GROUP ---
        const modal = document.getElementById('create-group-modal');
        const btn = document.getElementById('create-group-btn');
        const cancelBtn = document.getElementById('cancel-group-btn');
        const form = document.getElementById('create-group-form');

        btn.addEventListener('click', () => { modal.classList.remove('hidden'); modal.classList.add('flex'); });
        cancelBtn.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Creating...';
            submitBtn.disabled = true;

            const name = document.getElementById('group-name').value;
            const description = document.getElementById('group-desc').value;

            try {
                const { error } = await supabase.from('groups').insert({
                    name,
                    description,
                    created_by: currentUser.uid
                });

                if (error) throw error;

                form.reset();
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                fetchGroups();

            } catch (err) {
                showToast("Error: " + err.message, "error");
            } finally {
                submitBtn.textContent = 'Create';
                submitBtn.disabled = false;
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
