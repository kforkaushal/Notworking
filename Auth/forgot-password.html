<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NotWorking</title>
    <meta name="description" content="Reset your password to get back to doing nothing.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/Auth/forgot-password.html">
    <meta property="og:title" content="Forgot Password - NotWorking">
    <meta property="og:description" content="Reset your password to get back to doing nothing.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/Auth/forgot-password.html">
    <meta property="twitter:title" content="Forgot Password - NotWorking">
    <meta property="twitter:description" content="Reset your password to get back to doing nothing.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/Auth/forgot-password.html" />

    <link rel="icon" type="image/png" href="../src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Comic+Neue:wght@700&display=swap');

        .font-sans {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full mx-auto p-4">
            <a href="../index.html" class="flex justify-center mb-8">
                <img src="../src/assets/logo.svg" alt="NotWorking Logo" class="h-16 w-auto">
            </a>

            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Forgot Password?</h1>
                    <p class="text-slate-500 mt-1">Don't worry, even passwords get tired sometimes.</p>
                </div>

                <form id="forgot-password-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm"
                                placeholder="layoff.larry@notworking.com">
                        </div>
                    </div>

                    <!-- Status Message -->
                    <div id="status-message" class="hidden text-sm p-3 rounded-md text-center"></div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-slate-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-800 transition-all hover:-translate-y-0.5">
                            Send Reset Link
                        </button>
                    </div>
                </form>

                <div class="mt-6 text-center">
                    <a href="login.html"
                        class="text-sm font-bold text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1 transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { handlePasswordReset } from '../Data/auth-handler.js';

        const form = document.getElementById('forgot-password-form');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value;
            const btn = form.querySelector('button[type="submit"]');

            try {
                btn.disabled = true;
                btn.textContent = "Sending...";

                await handlePasswordReset(email);

                statusMessage.textContent = "Check your email! A password reset link has been sent.";
                statusMessage.className = "text-sm p-3 rounded-md text-center bg-green-100 text-green-700";
                statusMessage.classList.remove('hidden');
                form.reset();

            } catch (error) {
                console.error("Error sending reset email:", error);
                statusMessage.textContent = error.message;
                statusMessage.className = "text-sm p-3 rounded-md text-center bg-red-100 text-red-600";
                statusMessage.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
