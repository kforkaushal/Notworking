<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NotWorking</title>
    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Comic+Neue:wght@700&display=swap');

        .font-sans {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full mx-auto p-4">
            <a href="../index.html" class="flex justify-center mb-8">
                <img src="../src/assets/logo.svg" alt="NotWorking Logo" class="h-16 w-auto">
            </a>

            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
                    <p class="text-slate-500 mt-1">Ready to resume doing nothing?</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm"
                                value="layoff.larry@notworking.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        <div class="mt-1 relative">
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm"
                                value="password123">
                            <button type="button" id="toggle-password-btn"
                                class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600">
                                <i id="password-icon" data-lucide="eye-off" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox"
                                class="h-4 w-4 text-red-600 focus:ring-red-500 border-slate-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-slate-900">Remember me</label>
                        </div>
                        <!-- "Forgot your password?" link was here and has been removed. -->
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden text-sm text-red-600 bg-red-100 p-3 rounded-md text-center">
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-slate-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-800 transition-all hover:-translate-y-0.5">
                            Log In
                        </button>
                    </div>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-slate-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-white px-2 text-slate-500">Or continue with</span>
                    </div>
                </div>

                <div>
                    <button id="google-signin-btn" type="button"
                        class="w-full inline-flex justify-center items-center py-3 px-4 border border-slate-300 rounded-full shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition-all hover:scale-105 active:scale-95">
                        <img class="w-5 h-5" src="https://www.svgrepo.com/show/475656/google-color.svg"
                            alt="Google icon">
                        <span class="ml-2">Sign in with Google</span>
                    </button>
                </div>

                <p class="mt-6 text-center text-sm text-slate-500">
                    Not a member yet?
                    <a href="signup.html" class="font-bold text-brand-blue hover:underline">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        // Centralized clients
        import { auth } from '../Data/firebase-client.js';
        import supabase from '../Data/supabase-client.js';
        import { handleEmailPasswordLogin, handleGoogleAuth, displayError, setSupabaseSession } from '../Data/auth-handler.js';

        // Firebase functions
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

        let isAuthInProgress = false;

        // --- REDIRECT IF ALREADY LOGGED IN ---
        onAuthStateChanged(auth, async (user) => {
            if (isAuthInProgress) return; // Don't interrupt active auth flow

            if (user) {
                console.log('User already logged in. Verifying Supabase session before redirect...');
                try {
                    await setSupabaseSession(user);
                    // Use relative path consistent with other pages
                    window.location.href = '../feed.html';
                } catch (error) {
                    console.error("Failed to set Supabase session on login page, user will stay here.", error);
                }
            }
        });

        // --- LOGIN LOGIC ---
        const loginForm = document.getElementById('login-form');
        const errorMessageDiv = document.getElementById('error-message');
        const googleSignInBtn = document.getElementById('google-signin-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the form from submitting the default way
            isAuthInProgress = true;

            const email = loginForm.email.value;
            const password = loginForm.password.value;
            const rememberMe = document.getElementById('remember-me').checked;

            try {
                await handleEmailPasswordLogin(email, password, rememberMe);
                // Redirect manually after successful login
                window.location.href = '../feed.html';
            } catch (error) {
                isAuthInProgress = false; // Reset flag on error
                const errorMessage = "Invalid email or password. Please try again.";
                console.error('Login Error:', error.code, error.message);
                errorMessageDiv.classList.remove('bg-green-100', 'text-green-600');
                errorMessageDiv.classList.add('bg-red-100', 'text-red-600');
                displayError(errorMessageDiv, errorMessage);
            }
        });

        // --- GOOGLE SIGN-IN LOGIC ---
        googleSignInBtn.addEventListener('click', async () => {
            isAuthInProgress = true;
            try {
                await handleGoogleAuth();
                window.location.href = '../feed.html';
            } catch (error) {
                isAuthInProgress = false;
                console.error('Google Sign-In Error:', error);
                errorMessageDiv.classList.remove('bg-green-100', 'text-green-600');
                errorMessageDiv.classList.add('bg-red-100', 'text-red-600');
                displayError(errorMessageDiv, `Error: ${error.message}`);
            }
        });

        // --- SHOW/HIDE PASSWORD LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('password-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordIcon.setAttribute('data-lucide', isPassword ? 'eye' : 'eye-off');
            lucide.createIcons(); // Re-render the icon
        });

        // Initialize Lucide icons on page load
        lucide.createIcons();
    </script>
</body>

</html>
