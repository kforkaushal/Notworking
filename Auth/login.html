<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NotWorking</title>
    <link rel="icon" type="image/png" href="src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Comic+Neue:wght@700&display=swap');

        .font-sans {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full mx-auto p-4">
            <a href="index.html" class="flex justify-center mb-8">
                <img src="src/assets/logo.svg" alt="NotWorking Logo" class="h-16 w-auto">
            </a>

            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
                    <p class="text-slate-500 mt-1">Ready to resume doing nothing?</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm"
                                value="layoff.larry@notworking.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" autocomplete="current-password" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm"
                                value="password123">
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden text-sm text-red-600 bg-red-100 p-3 rounded-md text-center"></div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-slate-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-800 transition-all hover:-translate-y-0.5">
                            Log In
                        </button>
                    </div>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-slate-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-white px-2 text-slate-500">Or continue with</span>
                    </div>
                </div>

                <div>
                    <button id="google-signin-btn" type="button"
                        class="w-full inline-flex justify-center items-center py-3 px-4 border border-slate-300 rounded-full shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition-all hover:scale-105 active:scale-95">
                        <img class="w-5 h-5" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google icon">
                        <span class="ml-2">Sign in with Google</span>
                    </button>
                </div>

                <p class="mt-6 text-center text-sm text-slate-500">
                    Not a member yet?
                    <a href="signup.html" class="font-bold text-brand-blue hover:underline">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        // Centralized clients
        import { auth } from '../Data/firebase-client.js';

        // Firebase functions
        import { signInWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


        // --- REDIRECT IF ALREADY LOGGED IN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, redirect to feed.
                console.log('User already logged in. Redirecting to feed...');
                window.location.href = '../feed.html';
            }
        });

        // --- LOGIN LOGIC ---
        const loginForm = document.getElementById('login-form');
        const errorMessageDiv = document.getElementById('error-message');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent the form from submitting the default way

            const email = loginForm.email.value;
            const password = loginForm.password.value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Signed in successfully
                    const user = userCredential.user;
                    console.log('User logged in:', user);
                    // Redirect to the feed page
                    window.location.href = '../feed.html';
                })
                .catch((error) => {
                    const errorMessage = "Invalid email or password. Please try again.";
                    console.error('Login Error:', error.code, error.message);
                    errorMessageDiv.textContent = errorMessage;
                    errorMessageDiv.classList.remove('hidden');
                });
        });

        // --- GOOGLE SIGN-IN LOGIC ---
        const googleSignInBtn = document.getElementById('google-signin-btn');
        const provider = new GoogleAuthProvider();

        googleSignInBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // This gives you a Google Access Token. You can use it to access the Google API.
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;
                    console.log('Google sign-in successful:', user);
                    window.location.href = '../feed.html';
                }).catch((error) => {
                    console.error('Google Sign-In Error:', error);
                    errorMessageDiv.textContent = `Error: ${error.message}`;
                    errorMessageDiv.classList.remove('hidden');
                });
        });
    </script>
</body>

</html>
