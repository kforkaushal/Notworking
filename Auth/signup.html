<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NotWorking</title>
    <meta name="description"
        content="Join the NotWorking revolution. Create your profile and start ignoring responsibilities today.">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://notworking-in.vercel.app/Auth/signup.html">
    <meta property="og:title" content="Sign Up - NotWorking">
    <meta property="og:description"
        content="Join the NotWorking revolution. Create your profile and start ignoring responsibilities today.">
    <meta property="og:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://notworking-in.vercel.app/Auth/signup.html">
    <meta property="twitter:title" content="Sign Up - NotWorking">
    <meta property="twitter:description"
        content="Join the NotWorking revolution. Create your profile and start ignoring responsibilities today.">
    <meta property="twitter:image" content="https://notworking-in.vercel.app/src/assets/og-image.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://notworking-in.vercel.app/Auth/signup.html" />

    <link rel="icon" type="image/png" href="../src/assets/logo-white-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Comic+Neue:wght@700&display=swap');

        .font-sans {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <div class="min-h-screen flex flex-col items-center justify-center py-12">
        <div class="max-w-md w-full mx-auto p-4">
            <a href="index.html" class="flex justify-center mb-8">
                <img src="../src/assets/logo.svg" alt="NotWorking Logo" class="h-16 w-auto">
            </a>

            <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Join the Ranks</h1>
                    <p class="text-slate-500 mt-1">Create an account to start doing nothing.</p>
                </div>

                <form id="signup-form" class="space-y-6">
                    <div>
                        <label for="fullname" class="block text-sm font-medium text-slate-700">Full Name</label>
                        <div class="mt-1">
                            <input id="fullname" name="fullname" type="text" autocomplete="name" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
                        <div class="mt-1">
                            <input id="username" name="username" type="text" required pattern="[a-zA-Z0-9_]+"
                                title="Username must be alphanumeric with underscores only."
                                placeholder="unique_username"
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" autocomplete="new-password" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-blue focus:border-brand-blue sm:text-sm">
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden text-sm text-red-600 bg-red-100 p-3 rounded-md text-center">
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-lg text-sm font-bold text-white bg-red-500 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all hover:scale-105 active:scale-95">
                            Join the Void
                        </button>
                    </div>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-slate-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-white px-2 text-slate-500">Or sign up with</span>
                    </div>
                </div>

                <div>
                    <button id="google-signup-btn" type="button"
                        class="w-full inline-flex justify-center items-center py-3 px-4 border border-slate-300 rounded-full shadow-sm bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition-all hover:scale-105 active:scale-95">
                        <img class="w-5 h-5" src="https://www.svgrepo.com/show/475656/google-color.svg"
                            alt="Google icon">
                        <span class="ml-2">Sign up with Google</span>
                    </button>
                </div>

                <p class="mt-6 text-center text-sm text-slate-500">
                    Already a member?
                    <a href="login.html" class="font-bold text-brand-blue hover:underline">Log in</a>
                </p>
            </div>
        </div>
    </div>
    <p class="mt-8 text-center text-xs text-slate-400">
        <a href="../terms.html" class="hover:underline">Terms of Service</a> &bull;
        <a href="../privacy.html" class="hover:underline">Privacy Policy</a>
    </p>
    </div>

    <!-- Firebase -->
    <script type="module">
        // Centralized clients
        import { auth } from '../Data/firebase-client.js';
        import { handleEmailPasswordSignUp, handleGoogleAuth, displayError } from '../Data/auth-handler.js';

        // Firebase functions for auth state
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

        let isAuthInProgress = false;

        // --- REDIRECT IF ALREADY LOGGED IN ---
        onAuthStateChanged(auth, async (user) => {
            if (isAuthInProgress) return; // Don't interrupt active auth flow

            if (user) {
                console.log('User already logged in. Verifying Supabase session before redirect...');
                try {
                    const { data: profile } = await supabase.from('profiles')
                        .select('username')
                        .eq('id', user.uid)
                        .maybeSingle();

                    if (profile && profile.username) {
                        window.location.href = '../feed.html';
                    } else {
                        localStorage.setItem('nw_signing_up', 'true');
                        window.location.href = 'setup.html';
                    }
                } catch (error) {
                    console.error("Failed to verify profile completeness, signing out user.", error);
                    await auth.signOut();
                }
            }
        });

        // --- SIGN UP LOGIC ---
        const signupForm = document.getElementById('signup-form');
        const errorMessageDiv = document.getElementById('error-message');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the form from submitting the default way
            isAuthInProgress = true;

            const fullname = signupForm.fullname.value;
            const username = signupForm.username.value;
            const email = signupForm.email.value;
            const password = signupForm.password.value;

            try {
                await handleEmailPasswordSignUp(fullname, email, password, username);
                localStorage.setItem('nw_signing_up', 'true');
                window.location.href = 'setup.html';
            } catch (error) {
                isAuthInProgress = false;
                console.error('Signup Error:', error);
                await auth.signOut();
                displayError(errorMessageDiv, `Registration Failed: ${error.message}`);
            }
        });

        // --- GOOGLE SIGN-UP LOGIC ---
        const googleSignUpBtn = document.getElementById('google-signup-btn');

        googleSignUpBtn.addEventListener('click', async () => {
            isAuthInProgress = true;
            try {
                const { user, isNewUser } = await handleGoogleAuth();
                if (isNewUser) {
                    localStorage.setItem('nw_signing_up', 'true');
                    window.location.href = 'setup.html';
                } else {
                    window.location.href = '../feed.html';
                }
            } catch (error) {
                isAuthInProgress = false;
                console.error('Google Sign-In Error:', error);
                await auth.signOut();
                displayError(errorMessageDiv, `Google Sign-Up Failed: ${error.message}`);
            }
        });
    </script>
</body>

</html>
