    <!-- Mobile Bottom Nav -->

    <div id="edit-profile-modal"
        class="fixed inset-0 z-50 bg-black/50 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-xl w-full max-w-lg p-6 m-4 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Edit Profile</h3>
            <form id="edit-profile-form" class="space-y-4">
                <input id="edit-name" type="text" placeholder="Full Name" class="w-full p-2 border rounded" required>
                <input id="edit-username" type="text" placeholder="Username (unique)" class="w-full p-2 border rounded">
                <textarea id="edit-bio" placeholder="Bio" class="w-full p-2 border rounded" rows="3"></textarea>
                <input id="edit-experience" type="text" placeholder="Experience" class="w-full p-2 border rounded">
                <input id="edit-skills" type="text" placeholder="Skills (comma separated)"
                    class="w-full p-2 border rounded">
                <div class="flex items-center gap-4">
                    <img id="modal-avatar-preview" src="" class="w-12 h-12 rounded-full bg-slate-200">
                    <button type="button" id="change-photo-btn" class="text-sm text-blue-600 font-bold">Change
                        Photo</button>
                    <input type="file" id="avatar-file-input" class="hidden">
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2 text-slate-600">Cancel</button>
                    <button type="submit" id="save-changes-btn"
                        class="px-4 py-2 bg-slate-900 text-white rounded">Save</button>
                </div>
            </form>
        </div>

    <script type="module">
        import { auth, db } from '../Data/firebase-client.js';
        import supabase, { setSupabaseToken } from '../Data/supabase-client.js';
        import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        let currentUser = null;
        let viewedProfileId = null;
        let isOwner = false;

        // --- NOTIFICATION HELPER ---
        async function createNotification(type, entityId, recipientId) {
            if (!currentUser || currentUser.uid === recipientId) return;

            const payload = {
                type,
                user_id: recipientId,
                actor_id: currentUser.uid
            };
            // For profile, we only have 'follow' which has no post_id
            if (entityId && (type === 'like' || type === 'comment')) {
                payload.post_id = entityId;
            }

            try {
                await supabase.from('notifications').insert(payload);
            } catch (error) {
                console.error("Notification failed:", error);
            }
        }

        // --- FETCH & DISPLAY USER POSTS ---
        async function fetchUserPosts(userId) {
            const container = document.getElementById('user-posts-container');
            container.innerHTML = '<div class="text-center py-8"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto text-slate-400"></i></div>';
            lucide.createIcons();

            // Fetch posts ONLY for this user
            const { data: posts, error } = await supabase.from('posts')
                .select(`*, likes(count), comments(count), profiles(username, full_name, avatar_url)`)
                .eq('user_id', userId)
                .order('created_at', { ascending: false });

            container.innerHTML = '';

            // Update Post Count Stat
            document.getElementById('posts-count').textContent = posts?.length || 0;

            if (!posts || posts.length === 0) {
                container.innerHTML = `
                <div class="bg-white p-8 rounded-lg border border-slate-200 text-center">
                    <p class="text-slate-500">This user hasn't posted anything yet.</p>
                    ${isOwner ? '<a href="feed.html" class="text-blue-500 font-bold mt-2 inline-block">Create your first post</a>' : ''}
                </div>`;
                return;
            }

            posts.forEach(post => {
                // Reuse the card logic (simplified for inline script)
                const div = document.createElement('div');
                div.className = "bg-white p-5 rounded-lg border border-slate-200 mb-4 shadow-sm";

                let mediaHTML = '';
                if (post.media_url) {
                    mediaHTML = post.media_type === 'video'
                        ? `<video controls src="${post.media_url}" class="mt-3 rounded w-full max-h-80 object-cover"></video>`
                        : `<img src="${post.media_url}" loading="lazy" class="mt-3 rounded w-full max-h-80 object-cover">`;
                }

                // Delete button for owner
                const deleteBtn = isOwner ? `
                <button class="delete-post-btn text-slate-400 hover:text-red-500 float-right" data-id="${post.id}">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>` : '';

                div.innerHTML = `
                ${deleteBtn}
                <div class="flex gap-3">
                    <img src="${post.profiles.avatar_url || 'src/assets/avatar-placeholder.png'}" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <p class="font-bold text-sm">${post.profiles.full_name}</p>
                        <p class="text-xs text-slate-500">${new Date(post.created_at).toLocaleDateString()}</p>
                    </div>
                </div>
                <p class="mt-2 text-slate-800">${post.content || ''}</p>
                ${mediaHTML}
                <div class="mt-3 pt-3 border-t border-slate-100 flex gap-4 text-xs text-slate-500 font-bold">
                    <span class="flex items-center gap-1"><i data-lucide="heart" class="w-3 h-3"></i> ${post.likes[0]?.count || 0}</span>
                    <span class="flex items-center gap-1"><i data-lucide="message-circle" class="w-3 h-3"></i> ${post.comments[0]?.count || 0}</span>
                </div>
            `;
                container.appendChild(div);
            });
            lucide.createIcons();

            // Attach delete listeners
            if (isOwner) {
                document.querySelectorAll('.delete-post-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (!confirm("Delete this post?")) return;
                        const { error } = await supabase.from('posts').delete().eq('id', btn.dataset.id);
                        if (!error) btn.closest('div').remove();
                    });
                });
            }
        }

        // --- LOAD PROFILE ---
        async function loadProfile(usernameParam) {
            let query = supabase.from('profiles').select('*');

            if (usernameParam) { // Search by username from URL
                query = query.ilike('username', usernameParam);
            } else if (currentUser) {
                query = query.eq('id', currentUser.uid);
            } else {
                return window.location.href = 'Auth/login.html';
            }

            const { data: profile, error } = await query.single();

            if (error || !profile) {
                document.getElementById('profile-name').textContent = "User not found";
                return;
            }

            viewedProfileId = profile.id;
            isOwner = currentUser && currentUser.uid === profile.id;

            // UI Updates
            document.getElementById('profile-name').textContent = profile.full_name;
            document.getElementById('profile-username').textContent = `@${profile.username || 'user'}`;
            document.getElementById('profile-bio').textContent = profile.bio || "No bio yet.";
            document.getElementById('profile-image').src = profile.avatar_url || 'src/assets/avatar-placeholder.png';
            document.getElementById('experience-text').textContent = profile.experience || "No experience.";

            // Render Lists
            const renderTags = (id, tags, color) => {
                const el = document.getElementById(id);
                el.innerHTML = tags?.length ? tags.map(t => `<span class="${color} px-2 py-1 rounded text-xs font-bold">${t}</span>`).join('') : '<span class="text-xs text-slate-400">None</span>';
            };
            renderTags('skills-list', profile.skills, 'bg-slate-200 text-slate-700');
            renderTags('badges-list', profile.badges, 'bg-yellow-100 text-yellow-700');

            // Toggle Buttons
            if (isOwner) {
                document.getElementById('edit-profile-btn').classList.remove('hidden');
                document.getElementById('settings-btn').classList.remove('hidden'); // Show Settings
                document.getElementById('settings-btn').classList.add('flex');
                document.getElementById('follow-btn').classList.add('hidden');
                document.getElementById('message-btn').classList.add('hidden');
            } else {
                document.getElementById('edit-profile-btn').classList.add('hidden');
                document.getElementById('follow-btn').classList.remove('hidden');
                const messageBtn = document.getElementById('message-btn');
                messageBtn.classList.remove('hidden');
                messageBtn.classList.add('inline-flex'); // Use flex to center content if needed
                messageBtn.href = `messages.html?user=${viewedProfileId}`;
                checkFollowStatus();
            }

            // LOAD POSTS FOR THIS USER
            fetchUserPosts(viewedProfileId);
            fetchFollowStats(viewedProfileId);
        }

        // --- FOLLOW LOGIC ---
        async function checkFollowStatus() {
            if (!currentUser || isOwner) return;
            const btn = document.getElementById('follow-btn');
            const { data } = await supabase.from('followers').select('id').eq('follower_id', currentUser.uid).eq('following_id', viewedProfileId).single();

            if (data) {
                btn.textContent = "Unfollow";
                btn.classList.add('bg-slate-500');
            } else {
                btn.textContent = "Follow";
                btn.classList.remove('bg-slate-500');
            }

            btn.onclick = async () => {
                if (btn.textContent === "Follow") {
                    await supabase.from('followers').insert({ follower_id: currentUser.uid, following_id: viewedProfileId });
                    createNotification('follow', null, viewedProfileId);
                    btn.textContent = "Unfollow";
                    btn.classList.add('bg-slate-500');
                } else {
                    await supabase.from('followers').delete().eq('follower_id', currentUser.uid).eq('following_id', viewedProfileId);
                    btn.textContent = "Follow";
                    btn.classList.remove('bg-slate-500');
                }
                fetchFollowStats(viewedProfileId);
            };
        }

        async function fetchFollowStats(id) {
            const { count: followers } = await supabase.from('followers').select('*', { count: 'exact', head: true }).eq('following_id', id);
            const { count: following } = await supabase.from('followers').select('*', { count: 'exact', head: true }).eq('follower_id', id);
            document.getElementById('followers-count').textContent = followers || 0;
            document.getElementById('following-count').textContent = following || 0;
        }

        // --- HELPER: UPLOAD AVATAR ---
        async function uploadAvatarFile(file, userId) {
            const fileExt = file.name.split('.').pop();
            const fileName = `avatar-${Date.now()}.${fileExt}`; // Unique name
            const filePath = `avatars/${userId}/${fileName}`;

            // Upload to 'media' bucket
            const { error: uploadError } = await supabase.storage.from('media').upload(filePath, file);
            if (uploadError) throw uploadError;

            const { data } = supabase.storage.from('media').getPublicUrl(filePath);
            return data.publicUrl;
        }

        // --- EDIT PROFILE LOGIC ---
        const modal = document.getElementById('edit-profile-modal');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const avatarPreview = document.getElementById('modal-avatar-preview');
        let newAvatarFile = null;

        document.getElementById('edit-profile-btn').addEventListener('click', () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('edit-name').value = document.getElementById('profile-name').textContent;
            document.getElementById('edit-username').value = document.getElementById('profile-username').textContent.substring(1); // Remove '@'
            document.getElementById('edit-bio').value = document.getElementById('profile-bio').textContent;
            document.getElementById('edit-experience').value = document.getElementById('experience-text').textContent;
            const skills = Array.from(document.querySelectorAll('#skills-list span')).map(s => s.textContent).join(', ');
            document.getElementById('edit-skills').value = skills;
            avatarPreview.src = document.getElementById('profile-image').src;
        });

        document.getElementById('cancel-edit-btn').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('change-photo-btn').addEventListener('click', () => avatarFileInput.click());
        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                newAvatarFile = file;
                avatarPreview.src = URL.createObjectURL(file);
            }
        });

        document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-changes-btn');
            btn.textContent = "Saving...";
            btn.disabled = true;

            try {
                const newUsernameRaw = document.getElementById('edit-username').value;
                // Check if username is being changed and if it already exists (case-insensitive)
                if (newUsernameRaw && newUsernameRaw.toLowerCase() !== document.getElementById('profile-username').textContent.substring(1).toLowerCase()) {
                    const { data: existingUser, error: checkError } = await supabase.from('profiles').select('id').ilike('username', newUsernameRaw).single();
                    if (checkError && checkError.code !== 'PGRST116') throw checkError; // Ignore 'no rows' error, throw others
                    if (existingUser) {
                        throw new Error(`Username "${newUsernameRaw}" is already taken. Please choose another one.`);
                    }
                }

                const newName = document.getElementById('edit-name').value;
                const newUsername = document.getElementById('edit-username').value || document.getElementById('profile-username').textContent.substring(1);
                const newBio = document.getElementById('edit-bio').value;
                const newExp = document.getElementById('edit-experience').value;
                const newSkills = document.getElementById('edit-skills').value.split(',');

                let avatarUrl = document.getElementById('profile-image').src;
                if (newAvatarFile) {
                    avatarUrl = await uploadAvatarFile(newAvatarFile, currentUser.uid);
                }

                // Update Auth
                await updateProfile(currentUser, { displayName: newName, photoURL: avatarUrl });

                // Update DB
                const { error } = await supabase.from('profiles').upsert({
                    id: currentUser.uid,
                    full_name: newName,
                    username: newUsername,
                    bio: newBio,
                    experience: newExp,
                    skills: newSkills,
                    avatar_url: avatarUrl,
                    updated_at: new Date().toISOString()
                });

                if (error) throw error;

                window.location.reload();
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.textContent = "Save";
                btn.disabled = false;
            }
        });

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let username = params.get('username');

            // Removed /u/ path parsing logic as it requires server rewrites

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                if (user) {
                    await setSupabaseToken(await user.getIdToken());
                    const navProfileImg = document.getElementById('nav-profile-img');
                    navProfileImg.src = user.photoURL || 'src/assets/avatar-placeholder.png';

                    // --- OPTIMIZATION: Check LocalStorage First ---
                    let cachedUsername = localStorage.getItem('nw_username');
                    let userProfile = cachedUsername ? { username: cachedUsername } : null;

                    if (!userProfile) {
                        // Fetch the current user's profile ONLY if not cached
                        const { data } = await supabase.from('profiles').select('username').eq('id', user.uid).single();
                        userProfile = data;

                        // --- BACKFILL USERNAME FOR OLD USERS ---
                        if (!userProfile || !userProfile.username) {
                            console.log("Backfilling missing username...");
                            const randomSuffix = Math.floor(1000 + Math.random() * 9000);
                            const newUsername = `user_${randomSuffix}`;

                            // Update Supabase
                            const { error: sbError } = await supabase.from('profiles').upsert({
                                id: user.uid,
                                username: newUsername,
                                full_name: user.displayName || 'Anonymous',
                                email: user.email,
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'id' });

                            if (!sbError) {
                                // Update Firestore
                                const userRef = doc(db, "users", user.uid);
                                try {
                                    await updateDoc(userRef, { username: newUsername });
                                } catch (e) {
                                    // Doc might not exist, set it
                                    await setDoc(userRef, {
                                        username: newUsername,
                                        email: user.email,
                                        displayName: user.displayName,
                                        createdAt: new Date()
                                    }, { merge: true });
                                }
                                userProfile = { username: newUsername };
                            }
                        }

                        // Cache the username
                        if (userProfile && userProfile.username) {
                            localStorage.setItem('nw_username', userProfile.username);
                        }
                    }

                    // --- REDIRECT LOGIC REMOVED ---
                    // Reverted to simple query params for reliability
                    if (userProfile && userProfile.username) {
                        // Update Nav Link
                        navProfileImg.parentElement.href = `profile.html?username=${userProfile.username}`;
                    } else {
                        navProfileImg.parentElement.href = 'profile.html';
                    }
                }
                loadProfile(username);
            });
        });

        // --- SHARE BUTTON LOGIC ---
        const shareBtn = document.getElementById('share-btn');
        if (shareBtn) {
            shareBtn.addEventListener('click', () => {
                const username = document.getElementById('profile-username').textContent.substring(1); // Get username and remove '@'
                const shareUrl = `${window.location.origin}${window.location.pathname}?username=${username}`;

                navigator.clipboard.writeText(shareUrl).then(() => {
                    const originalContent = shareBtn.innerHTML;
                    shareBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied!';
                    lucide.createIcons({ nodes: [shareBtn] });

                    setTimeout(() => {
                        shareBtn.innerHTML = originalContent;
                        lucide.createIcons({ nodes: [shareBtn] }); // Re-render the share icon
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy link: ', err);
                    alert('Could not copy link to clipboard.');
                });
            });
        }

        // --- REALTIME FOLLOWER COUNT ---
        supabase.channel('public:followers')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'followers' }, (payload) => {
                const profileIdAffected = payload.new?.following_id || payload.old?.following_id;
                const followerId = payload.new?.follower_id || payload.old?.follower_id;

                // If the change affects the profile we are currently viewing,
                // or if the current user's following count might have changed.
                if (profileIdAffected === viewedProfileId || followerId === viewedProfileId) {
                    // Re-fetch the stats to update the UI in real-time
                    fetchFollowStats(viewedProfileId);
                }
            }).subscribe();

        lucide.createIcons();
    </script>
</body>

</html>
